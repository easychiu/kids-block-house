      scrollbar-width: none;

        gap: 4px !important;
        padding-right: 6px;
        border-right: 2px solid rgba(255,255,255,0.2);

      .mode-tab-btn {
        padding: 4px 7px !important;
        font-size: 11px !important;
      }
      .mode-tab-text {
        display: none !important;
      }
      .block-item-btn {
        width: 40px !important;
        height: 40px !important;
      }
      .block-item-label {
        display: none !important;
      }
    }

      function playTone(freq, type, duration, delay, gainVal) {
        if (!soundEnabled) return;
        try {
          ensureAudio();
          if (!audioCtx) return;
          const now = audioCtx.currentTime + (delay || 0);
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = type || 'sine';
          osc.frequency.setValueAtTime(freq, now);
          gain.gain.setValueAtTime(gainVal || 0.14, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now);
          osc.stop(now + duration);
        } catch (e) {
          // Ignore audio errors on restricted devices
        }
      }

      function playSfx(kind) {
        if (!soundEnabled) return;
        if (kind === 'place') {
          playTone(440, 'triangle', 0.09, 0, 0.16);
          playTone(660, 'sine', 0.13, 0.05, 0.16);
        } else if (kind === 'erase') {
          playTone(300, 'sawtooth', 0.08, 0, 0.12);
          playTone(180, 'triangle', 0.14, 0.05, 0.14);
        } else if (kind === 'magic') {
          const notes = [523.25, 659.25, 783.99, 1046.5];
          notes.forEach((n, idx) => playTone(n, 'triangle', 0.18, idx * 0.06, 0.15));
        } else if (kind === 'pig') {
          playTone(220, 'sawtooth', 0.11, 0, 0.12);
          playTone(260, 'sawtooth', 0.12, 0.12, 0.12);
        } else if (kind === 'chicken') {
          playTone(880, 'sine', 0.07, 0, 0.12);
          playTone(980, 'sine', 0.08, 0.09, 0.12);
        } else if (kind === 'sheep') {
          playTone(340, 'triangle', 0.22, 0, 0.14);
          playTone(310, 'triangle', 0.25, 0.12, 0.12);
        } else if (kind === 'firework') {
          const chord = [523.25, 659.25, 783.99, 987.77, 1318.5];
          chord.forEach((n, i) => playTone(n, 'sine', 0.28, i * 0.05, 0.13));
        } else if (kind === 'splash') {
          [392, 523.25, 659.25, 783.99].forEach((n, i) => playTone(n, 'sine', 0.14, i * 0.04, 0.14));
        } else if (kind === 'boing') {
          [260, 390, 585, 880].forEach((n, i) => playTone(n, 'triangle', 0.16, i * 0.045, 0.18));
        }
      }

            utter.rate = 1.02;

          ctx.fillStyle = '#e2e8f0';
          ctx.fillRect(0, 0, 16, 16);
          const brickColors = ['#b91c1c', '#dc2626', '#991b1b'];
          for (let row = 0; row < 4; row++) {
            const y = row * 4;
            const offset = (row % 2) * 4;

      function buildIslandBase() {
        for (let x = MIN_COORD; x <= MAX_COORD; x++) {
          for (let z = MIN_COORD; z <= MAX_COORD; z++) {
            const mesh = createBlockMesh('grass', true);
            mesh.position.set(x + 0.5, 0.5, z + 0.5);
            mesh.userData = { gx: x, gy: 0, gz: z, isBase: true };
            mesh.children.forEach(c => { c.userData = mesh.userData; });
            worldGroup.add(mesh);
            baseBlocks.set(posKey(x, 0, z), mesh);
          }
        }
        const dirtGeo = new THREE.BoxGeometry(GRID_SIZE - 0.2, 1.4, GRID_SIZE - 0.2);
        const dirtMat = new THREE.MeshLambertMaterial({ color: 0x713f12 });
        const dirtMesh = new THREE.Mesh(dirtGeo, dirtMat);
        dirtMesh.position.set(0, -0.7, 0);
        worldGroup.add(dirtMesh);

        const rockGeo = new THREE.BoxGeometry(GRID_SIZE - 2.4, 1.2, GRID_SIZE - 2.4);
        const rockMat = new THREE.MeshLambertMaterial({ color: 0x64748b });

      function updateBlockCounter() {
        const badge = document.getElementById('block-counter-badge');
        if (badge) {
          badge.textContent = `${userBlocks.size} 顆`;
        }
      }

      function setBlockSilent(gx, gy, gz, typeId) {
        if (gx < MIN_COORD || gx > MAX_COORD || gz < MIN_COORD || gz > MAX_COORD) return null;
        if (gy < 1 || gy > MAX_HEIGHT) return null;

        const key = posKey(gx, gy, gz);
        const existing = userBlocks.get(key);
        const prevType = existing ? existing.type : null;

        if (existing) {
          worldGroup.remove(existing.mesh);
          if (existing.light) worldGroup.remove(existing.light);
          userBlocks.delete(key);
        }

        if (!typeId) {
          updateBlockCounter();
          return { gx, gy, gz, prevType, newType: null };
        }

        const mesh = createBlockMesh(typeId);
        mesh.position.set(gx + 0.5, gy + 0.5, gz + 0.5);
        const uData = Object.assign(mesh.userData || {}, { gx, gy, gz, isBase: false, type: typeId });
        mesh.userData = uData;
        mesh.traverse(c => {
          if (c !== mesh) c.userData = uData;
        });

        mesh.scale.set(0.2, 0.2, 0.2);
        uData.animScale = 0.2;

        worldGroup.add(mesh);

        let ptLight = null;
        if (typeId === 'lamp') {
          ptLight = new THREE.PointLight(0xfbbf24, 1.1, 7);
          ptLight.position.set(gx + 0.5, gy + 0.5, gz + 0.5);
          worldGroup.add(ptLight);
        }

        userBlocks.set(key, { type: typeId, mesh, light: ptLight });
        updateBlockCounter();
        return { gx, gy, gz, prevType, newType: typeId };
      }

      function applySandGravity(gx, startGy, gz) {
        let landY = startGy;
        while (landY > 1 && !userBlocks.has(posKey(gx, landY - 1, gz))) {
          landY--;
        }
        if (landY === startGy) {
          const ch = setBlockSilent(gx, startGy, gz, 'sand');
          return ch ? [ch] : [];
        }
        const ch = setBlockSilent(gx, landY, gz, 'sand');
        const entry = userBlocks.get(posKey(gx, landY, gz));
        if (entry && entry.mesh) {
          entry.mesh.position.y = startGy + 0.5;
          entry.mesh.userData.fallY = startGy + 0.5;
          entry.mesh.userData.fallVel = 0;
          const below = userBlocks.get(posKey(gx, landY - 1, gz));
          entry.mesh.userData.bounceOnLand = !!(below && below.type === 'soft_mat');
        }
        return ch ? [ch] : [];
      }

      function scheduleWaterFlow(gx, gy, gz, spreadDepth) {
        const depth = spreadDepth || 0;
        setTimeout(() => {
          if (!userBlocks.has(posKey(gx, gy, gz))) return;
          // 1. Flow straight down if empty below (waterfall!)
          if (gy > 1 && !userBlocks.has(posKey(gx, gy - 1, gz))) {
            setBlockSilent(gx, gy - 1, gz, 'water');
            spawnBlockParticles(gx + 0.5, gy - 0.2, gz + 0.5, 0x38bdf8, 6);
            playSfx('splash');
            scheduleWaterFlow(gx, gy - 1, gz, depth);
            return;
          }
          // 2. Spread 1 step horizontally on supported surface
          if (depth < 1) {
            const dirs = [[1, 0], [-1, 0], [0, 1], [0, -1]];
            dirs.forEach(([dx, dz]) => {
              const nx = gx + dx;
              const nz = gz + dz;
              if (nx < MIN_COORD || nx > MAX_COORD || nz < MIN_COORD || nz > MAX_COORD) return;
              const supported = (gy === 1) || userBlocks.has(posKey(nx, gy - 1, nz));
              if (supported && !userBlocks.has(posKey(nx, gy, nz))) {
                setBlockSilent(nx, gy, nz, 'water');
                const childEntry = userBlocks.get(posKey(nx, gy, nz));
                if (childEntry && childEntry.mesh) {
                  childEntry.mesh.userData.waterScaleY = 0.72;
                }
                spawnBlockParticles(nx + 0.5, gy + 0.4, nz + 0.5, 0x7dd3fc, 4);
              }
            });
          }
        }, 180);
      }

      function recordChanges(changes) {
        const valid = changes.filter(Boolean);
        if (valid.length > 0) {
          undoStack.push(valid);
          if (undoStack.length > 40) undoStack.shift();
          autoSaveCurrentWorld();
          if (typeof checkStoryProgress === 'function') checkStoryProgress();
        }
      }

      function undoLastAction() {
        if (undoStack.length === 0) {
          speakCoach('已經回到最前面囉！');
          return;
        }
        const lastChanges = undoStack.pop();
        for (let i = lastChanges.length - 1; i >= 0; i--) {
          const ch = lastChanges[i];
          setBlockSilent(ch.gx, ch.gy, ch.gz, ch.prevType);
        }
        playSfx('erase');
        speakCoach('復原成功！回到上一步囉！');
        autoSaveCurrentWorld();
        if (typeof checkStoryProgress === 'function') checkStoryProgress();
      }

        const num = count || 10;

      function getTopSurfaceY(gx, gz) {
        for (let y = MAX_HEIGHT; y >= 1; y--) {
          if (userBlocks.has(posKey(gx, y, gz))) {
            return y + 1;
          }
        }
        return 1;
      }

      function spawnMobAt(mobType, gx, gz, silent) {
        if (mobs.length >= 14) {
          const oldest = mobs.shift();
          scene.remove(oldest.mesh);
        }
        const mesh = createMobMesh(mobType);
        const topY = getTopSurfaceY(Math.round(gx), Math.round(gz));
        mesh.position.set(gx + 0.5, topY, gz + 0.5);
        scene.add(mesh);

        const mobObj = {
          type: mobType,
          mesh,
          angle: Math.random() * Math.PI * 2,
          timer: 1 + Math.random() * 2,
          hopPhase: Math.random() * 10
        };
        mesh.userData = { isMob: true, mobRef: mobObj };
        mesh.children.forEach(c => { c.userData = mesh.userData; });
        mobs.push(mobObj);

        if (!silent) {
          spawnBlockParticles(gx + 0.5, topY + 0.5, gz + 0.5, 0xfde047, 10);

      // ==========================================
      // 7. 1-TAP MAGIC HOUSE PREFAB GENERATOR
      // ==========================================
      function getBlueprintBlocks(stampName, cx, cz) {
        const list = [];
        const add = (dx, dy, dz, type) => {
          list.push({ gx: cx + dx, gy: dy, gz: cz + dz, type });
        };

        if (stampName === 'cabin') {
          for (let dx = -2; dx <= 2; dx++) {
            for (let dz = -2; dz <= 2; dz++) {
              add(dx, 1, dz, 'stone');
              const isEdge = Math.abs(dx) === 2 || Math.abs(dz) === 2;
              if (isEdge) {
                for (let y = 2; y <= 3; y++) {
                  if (dx === 0 && dz === 2) {
                    add(dx, y, dz, 'door');
                  } else if ((dx === 0 && dz === -2 && y === 2) || (Math.abs(dx) === 2 && dz === 0 && y === 2)) {
                    add(dx, y, dz, 'glass');
                  } else {
                    add(dx, y, dz, 'wood');
                  }
                }
              }
            }
          }
          add(0, 3, 0, 'lamp');
          add(2, 2, 3, 'flower');
          add(-2, 2, 3, 'flower');
          for (let dx = -2; dx <= 2; dx++) {
            for (let dz = -2; dz <= 2; dz++) {
              add(dx, 4, dz, 'roof_red');
            }
          }
          for (let dx = -1; dx <= 1; dx++) {
            for (let dz = -1; dz <= 1; dz++) {
              add(dx, 5, dz, 'roof_red');
            }
          }
          add(0, 6, 0, 'gold');
        } else if (stampName === 'castle') {
          for (let dx = -2; dx <= 2; dx++) {
            for (let dz = -2; dz <= 2; dz++) {
              const isEdge = Math.abs(dx) === 2 || Math.abs(dz) === 2;
              const isCorner = Math.abs(dx) === 2 && Math.abs(dz) === 2;
              if (isEdge) {
                for (let y = 1; y <= 3; y++) {
                  if (dx === 0 && dz === 2 && y <= 2) {
                    add(dx, y, dz, 'door');
                  } else if (y === 2 && (dx === 0 || dz === 0)) {
                    add(dx, y, dz, 'glass');
                  } else {
                    add(dx, y, dz, 'pink');
                  }
                }
              }
              if (isCorner) {
                add(dx, 4, dz, 'pink');
                add(dx, 5, dz, 'gold');
                add(dx, 6, dz, 'roof_red');
              } else if (isEdge && ((dx + dz) % 2 === 0)) {
                add(dx, 4, dz, 'gold');
              }
            }
          }
          add(0, 1, 0, 'lamp');
        } else if (stampName === 'treehouse') {
          for (let y = 1; y <= 4; y++) {
            add(0, y, 0, 'wood');
          }
          for (let dx = -2; dx <= 2; dx++) {
            for (let dz = -2; dz <= 2; dz++) {
              add(dx, 4, dz, 'grass');
              const isEdge = Math.abs(dx) === 2 || Math.abs(dz) === 2;
              if (isEdge) {
                if (dx === 0 && dz === 2) {
                  add(dx, 5, dz, 'door');
                } else if (dx === 0 || dz === 0) {
                  add(dx, 5, dz, 'glass');
                } else {
                  add(dx, 5, dz, 'grass');
                }
              }
            }
          }
          for (let dx = -1; dx <= 1; dx++) {
            for (let dz = -1; dz <= 1; dz++) {
              add(dx, 6, dz, 'grass');
            }
          }
          add(0, 5, 0, 'lamp');
          add(1, 1, 1, 'flower');
          add(-1, 1, 1, 'flower');
        } else if (stampName === 'walls') {
          for (let dx = -2; dx <= 2; dx++) {
            for (let dz = -2; dz <= 2; dz++) {
              const isEdge = Math.abs(dx) === 2 || Math.abs(dz) === 2;
              if (isEdge) {
                for (let y = 1; y <= 2; y++) {
                  if (dx === 0 && dz === 2) {
                    add(dx, y, dz, 'door');
                  } else if (y === 2 && (dx === 0 || dz === 0)) {
                    add(dx, y, dz, 'glass');
                  } else {
                    add(dx, y, dz, 'brick');
                  }
                }
              }
            }
          }
        } else if (stampName === 'roof') {
          let baseRoofY = 3;
          for (let dx = -2; dx <= 2; dx++) {
            for (let dz = -2; dz <= 2; dz++) {
              for (let y = MAX_HEIGHT - 2; y >= 1; y--) {
                if (userBlocks.has(posKey(cx + dx, y, cz + dz))) {
                  if (y + 1 > baseRoofY) baseRoofY = y + 1;
                  break;
                }
              }
            }
          }
          baseRoofY = Math.min(baseRoofY, MAX_HEIGHT - 2);
          for (let dx = -2; dx <= 2; dx++) {
            for (let dz = -2; dz <= 2; dz++) {
              add(dx, baseRoofY, dz, 'roof_red');
            }
          }
          for (let dx = -1; dx <= 1; dx++) {
            for (let dz = -1; dz <= 1; dz++) {
              add(dx, baseRoofY + 1, dz, 'roof_red');
            }
          }
          add(0, baseRoofY + 2, 0, 'gold');
        } else if (stampName === 'pool') {
          for (let dx = -2; dx <= 2; dx++) {
            for (let dz = -2; dz <= 2; dz++) {
              const isEdge = Math.abs(dx) === 2 || Math.abs(dz) === 2;
              if (isEdge) {
                add(dx, 1, dz, 'gold');
                if (Math.abs(dx) === 2 && Math.abs(dz) === 2) {
                  add(dx, 2, dz, 'flower');
                }
              } else {
                add(dx, 1, dz, 'water');
              }
            }
          }
        }
        return list;
      }

      function applyMagicStamp(stampName, centerX, centerZ) {
        const cx = Math.max(MIN_COORD + 2, Math.min(MAX_COORD - 2, centerX));
        const cz = Math.max(MIN_COORD + 2, Math.min(MAX_COORD - 2, centerZ));

        const items = getBlueprintBlocks(stampName, cx, cz);
        const changes = [];
        items.forEach(item => {
          const ch = setBlockSilent(item.gx, item.gy, item.gz, item.type);
          if (ch) changes.push(ch);
        });
        recordChanges(changes);
        spawnBlockParticles(cx + 0.5, 3.5, cz + 0.5, 0xfde047, 18);
        playSfx('magic');

        const names = {
          cabin: '哇！溫馨小木屋蓋好囉！',
          castle: '太酷了！粉紅小城堡出現囉！',
          treehouse: '好棒的森林大樹屋！',
          walls: '四面圍牆和門窗蓋好囉！快來加屋頂吧！',
          roof: '魔法尖屋頂戴上去囉！',
          pool: '陽光游泳池蓋好囉！好涼快呀！'
        };
        speakCoach(names[stampName] || '魔法蓋房成功！');
      }

      // ==========================================
      // 8. STEP-BY-STEP GUIDED BLUEPRINT MODE
      // ==========================================
      let guidedActive = false;
      let guidedStep = 0;
      const guidedGhostGroup = new THREE.Group();
      scene.add(guidedGhostGroup);

      const GUIDED_STEPS = [
        {
          title: '第 1 步：點亮光方塊，圍出木頭牆壁！',
          blocks: (function () {
            const arr = [];
            for (let x = -2; x <= 1; x++) {
              for (let z = -2; z <= 1; z++) {
                if (x === -2 || x === 1 || z === -2 || z === 1) {
                  if (!(x === 0 && z === 1)) {
                    arr.push({ gx: x, gy: 1, gz: z, type: 'wood' });
                  }
                }
              }
            }
            return arr;
          })()
        },
        {
          title: '第 2 步：裝上小木門與透明玻璃窗！',
          blocks: (function () {
            const arr = [
              { gx: 0, gy: 1, gz: 1, type: 'door' },
              { gx: 0, gy: 2, gz: 1, type: 'door' }
            ];
            for (let x = -2; x <= 1; x++) {
              for (let z = -2; z <= 1; z++) {
                if (x === -2 || x === 1 || z === -2 || z === 1) {
                  if (!(x === 0 && z === 1)) {
                    const isWin = (x === -1 && z === -2) || (x === -2 && z === 0) || (x === 1 && z === 0);
                    arr.push({ gx: x, gy: 2, gz: z, type: isWin ? 'glass' : 'wood' });
                  }
                }
              }
            }
            return arr;
          })()
        },
        {
          title: '第 3 步：蓋上紅屋頂與門前小花朵！',
          blocks: (function () {
            const arr = [
              { gx: 0, gy: 2, gz: 0, type: 'lamp' },
              { gx: -2, gy: 1, gz: 2, type: 'flower' },
              { gx: 1, gy: 1, gz: 2, type: 'flower' }
            ];
            for (let x = -2; x <= 1; x++) {
              for (let z = -2; z <= 1; z++) {
                arr.push({ gx: x, gy: 3, gz: z, type: 'roof_red' });
              }
            }
            for (let x = -1; x <= 0; x++) {
              for (let z = -1; z <= 0; z++) {
                arr.push({ gx: x, gy: 4, gz: z, type: 'roof_red' });
              }
            }
            return arr;
          })()
        }
      ];

      function clearGuidedGhosts() {
        while (guidedGhostGroup.children.length > 0) {
          guidedGhostGroup.remove(guidedGhostGroup.children[0]);
        }
      }

      function renderGuidedStep() {
        clearGuidedGhosts();
        const banner = document.getElementById('guided-banner');
        if (!guidedActive) {
          if (banner) banner.classList.add('hidden');
          return;
        }
        if (banner) banner.classList.remove('hidden');

        const stepData = GUIDED_STEPS[guidedStep];
        if (!stepData) {
          guidedActive = false;
          if (banner) banner.classList.add('hidden');
          launchFireworks();
          if (typeof awardBadge === 'function') awardBadge('builder', true);
          return;
        }

        const remaining = stepData.blocks.filter(b => {
          const cur = userBlocks.get(posKey(b.gx, b.gy, b.gz));
          return !cur || cur.type !== b.type;
        });

        if (remaining.length === 0) {
          guidedStep++;
          playSfx('magic');
          renderGuidedStep();
          return;
        }

        const titleEl = document.getElementById('guided-step-title');
        if (titleEl) titleEl.textContent = `${stepData.title}（差 ${remaining.length} 顆）`;

        const progEl = document.getElementById('guided-progress-bar');
        if (progEl) {
          const totalPct = Math.round(((guidedStep + (1 - remaining.length / stepData.blocks.length)) / GUIDED_STEPS.length) * 100);
          progEl.style.width = `${Math.max(12, totalPct)}%`;
        }

        const ghostMat = new THREE.MeshBasicMaterial({
          color: 0xfde047,
          wireframe: false,
          transparent: true,
          opacity: 0.48
        });

        remaining.forEach(b => {
          const gMesh = new THREE.Mesh(new THREE.BoxGeometry(0.92, 0.92, 0.92), ghostMat);
          gMesh.position.set(b.gx + 0.5, b.gy + 0.5, b.gz + 0.5);
          gMesh.userData = { isGuidedGhost: true, gx: b.gx, gy: b.gy, gz: b.gz, targetType: b.type };
          guidedGhostGroup.add(gMesh);
        });
      }

      function completeCurrentGuidedStep() {
        if (!guidedActive) return;
        const stepData = GUIDED_STEPS[guidedStep];
        if (!stepData) return;

        const changes = [];
        stepData.blocks.forEach(b => {
          const ch = setBlockSilent(b.gx, b.gy, b.gz, b.type);
          if (ch) changes.push(ch);
        });
        recordChanges(changes);
        spawnBlockParticles(0, 2.5, 0, 0xfde047, 16);
        guidedStep++;
        playSfx('magic');
        renderGuidedStep();
      }

      // ==========================================
      // 9. CAMERA ORBIT & HOVER GHOST PREVIEW
      // ==========================================
      let camTheta = Math.PI * 0.22;
      let camPhi = Math.PI * 0.30;
      let camRadius = 16.5;
      const camTarget = new THREE.Vector3(0, 1.3, 0);

      function updateCameraPosition() {
        camPhi = Math.max(0.32, Math.min(1.28, camPhi));
        camRadius = Math.max(9.0, Math.min(26, camRadius));
        const sinPhi = Math.sin(camPhi);
        camera.position.x = camTarget.x + camRadius * sinPhi * Math.sin(camTheta);
        camera.position.y = camTarget.y + camRadius * Math.cos(camPhi);
        camera.position.z = camTarget.z + camRadius * sinPhi * Math.cos(camTheta);
        camera.lookAt(camTarget);
      }
      updateCameraPosition();

      const previewMat = new THREE.MeshBasicMaterial({
        color: 0xffffff,
        wireframe: true,
        transparent: true,
        opacity: 0.75
      });
      const previewMesh = new THREE.Mesh(new THREE.BoxGeometry(1.04, 1.04, 1.04), previewMat);
      previewMesh.visible = false;
      scene.add(previewMesh);

      function renderBadgeGrid() {
        const grid = document.getElementById('badge-grid');
        if (!grid) return;

          card.innerHTML =

      let storyActive = false;
      let activeStoryId = null;

      function countBlocksOfType(typeId) {
        let n = 0;
        userBlocks.forEach(val => {
          if (val && val.type === typeId) n++;
        });
        return n;
      }

      function ensureArchieTeacherNearby() {
        const has = mobs.some(m => m.type === 'archie_teacher');
        if (!has) {
          spawnMobAt('archie_teacher', -1, 1, true);
          if (typeof awardBadge === 'function') awardBadge('polite', false);
        }
      }

      function updateStoryBanner() {
        const banner = document.getElementById('story-banner');
        if (!banner) return;
        if (!storyActive || !activeStoryId || !STORY_DEFS[activeStoryId]) {
          banner.classList.add('hidden');
          return;
        }
        banner.classList.remove('hidden');
        const def = STORY_DEFS[activeStoryId];
        const progress = def.eval();
        const titleEl = document.getElementById('story-step-title');
        const barEl = document.getElementById('story-progress-bar');
        const hintEl = document.getElementById('story-step-hint');
        if (titleEl) titleEl.textContent = '情節：' + def.title + ' — ' + def.goal;
        if (hintEl) hintEl.textContent = progress.hint;
        if (barEl) {
          const pct = Math.round((progress.done / progress.total) * 100);
          barEl.style.width = pct + '%';
        }
      }

      function startStory(storyId) {
        const def = STORY_DEFS[storyId];
        if (!def) return;
        if (guidedActive) {
          guidedActive = false;
          renderGuidedStep();
        }
        storyActive = true;
        activeStoryId = storyId;
        ensureArchieTeacherNearby();
        const pick = {
          school_day: 'chalk_board',
          share_garden: 'flower',
          rainbow_bridge: 'rainbow',
          star_party: 'star_tile'
        }[storyId];
        if (pick && BLOCK_MAP[pick]) {
          selectedBlockId = pick;
        }
        setMode('build', false);
        renderBlockPalette();
        updateStoryBanner();
        playSfx('magic');
        speakCoach(def.voice);
        checkStoryProgress();
      }

        activeStoryId = null;
        updateStoryBanner();
        speakCoach('情節先休息一下，自由蓋房子也可以喔！');
      }

      function checkStoryProgress() {
        if (!storyActive || !activeStoryId) {
          updateStoryBanner();
          return;
        }
        const def = STORY_DEFS[activeStoryId];
        if (!def) return;
        const progress = def.eval();
        updateStoryBanner();
        if (progress.complete) {
          const badgeId = def.badge;
          const newly = awardBadge(badgeId, true);
          storyActive = false;
          activeStoryId = null;

      function setMode(mode, announce) {

          build: document.getElementById('tab-build'),

        };

          } else if (mode === 'story') {
            speakCoach('幼幼園情節！選一個故事，跟著阿奇老師完成目標拿徽章！');

        const dockBody = document.getElementById('bottom-dock-body');
        const iconEl = document.getElementById('dock-toggle-icon');
        const textEl = document.getElementById('dock-toggle-text');

      const raycaster = new THREE.Raycaster();
      const pointerNDC = new THREE.Vector2();

      function getRaycastTargets() {
        const targets = [];
        if (guidedActive) {
          guidedGhostGroup.children.forEach(c => targets.push(c));
        }
        baseBlocks.forEach(mesh => targets.push(mesh));
        userBlocks.forEach(entry => targets.push(entry.mesh));
        mobs.forEach(m => targets.push(m.mesh));
        return targets;
      }

      function findRootObjectData(obj) {
        let cur = obj;
        while (cur) {
          if (cur.userData && (cur.userData.isBase !== undefined || cur.userData.isGuidedGhost || cur.userData.isMob)) {
            return { node: cur, data: cur.userData };
          }
          cur = cur.parent;
        }
        return null;
      }

      function handleWorldTap(clientX, clientY) {
        ensureAudio();
        const rect = renderer.domElement.getBoundingClientRect();
        pointerNDC.x = ((clientX - rect.left) / rect.width) * 2 - 1;
        pointerNDC.y = -((clientY - rect.top) / rect.height) * 2 + 1;

        raycaster.setFromCamera(pointerNDC, camera);
        const hits = raycaster.intersectObjects(getRaycastTargets(), true);
        if (hits.length === 0) return;

        const hit = hits[0];
        const info = findRootObjectData(hit.object);
        if (!info) return;

        const { data } = info;

        if (data.isGuidedGhost) {
          const ch = setBlockSilent(data.gx, data.gy, data.gz, data.targetType);
          if (ch) recordChanges([ch]);
          spawnBlockParticles(data.gx + 0.5, data.gy + 0.5, data.gz + 0.5, 0xfde047, 10);
          playSfx('place');
          renderGuidedStep();
          return;
        }

        if (data.isMob && currentMode !== 'erase') {
          const mob = data.mobRef;
          mob.hopPhase = 0;
          mob.mesh.position.y += 0.45;
          spawnBlockParticles(mob.mesh.position.x, mob.mesh.position.y + 0.5, mob.mesh.position.z, 0xf472b6, 8);
          playSfx(mob.type === 'pig' ? 'pig' : (mob.type === 'chicken' ? 'chicken' : 'sheep'));
          return;
        }

        const normal = hit.face ? hit.face.normal.clone() : new THREE.Vector3(0, 1, 0);
        normal.transformDirection(hit.object.matrixWorld).round();

        const hitGx = data.gx;
        const hitGy = data.gy;
        const hitGz = data.gz;

        if (currentMode === 'erase') {
          if (data.isBase) {
            speakCoach('小島的綠草地不能敲掉喔！');
            return;
          }
          const ch = setBlockSilent(hitGx, hitGy, hitGz, null);
          if (ch) {
            recordChanges([ch]);
            spawnBlockParticles(hitGx + 0.5, hitGy + 0.5, hitGz + 0.5, 0xf87171, 12);
            playSfx('erase');
            if (guidedActive) renderGuidedStep();
          }
          return;
        }

        const placeX = hitGx + normal.x;
        const placeY = hitGy + normal.y;
        const placeZ = hitGz + normal.z;

        if (currentMode === 'magic') {
          applyMagicStamp(selectedStampId, placeX, placeZ);
          return;
        }

        if (currentMode === 'mob') {
          spawnMobAt(selectedMobId, placeX, placeZ, false);
          return;
        }

        const changes = [];
        const span = brushSize === 2 ? [0, 1] : [0];

        span.forEach(dx => {
          span.forEach(dz => {
            const tx = placeX + dx;
            const tz = placeZ + dz;
            if (selectedBlockId === 'door') {
              const c1 = setBlockSilent(tx, placeY, tz, 'door');
              const c2 = setBlockSilent(tx, placeY + 1, tz, 'door');
              if (c1) changes.push(c1);
              if (c2) changes.push(c2);
            } else if (selectedBlockId === 'sand') {
              const sandChanges = applySandGravity(tx, placeY, tz);
              sandChanges.forEach(c => changes.push(c));
            } else {
              const c = setBlockSilent(tx, placeY, tz, selectedBlockId);
              if (c) changes.push(c);
              if (selectedBlockId === 'water') {
                playSfx('splash');
                scheduleWaterFlow(tx, placeY, tz, 0);
              } else if (selectedBlockId === 'soft_mat') {
                playSfx('boing');
              }
            }
          });
        });

        if (changes.length > 0) {
          recordChanges(changes);
          const def = BLOCK_MAP[selectedBlockId];
          spawnBlockParticles(placeX + 0.5, placeY + 0.5, placeZ + 0.5, def ? def.color : 0xfde047, 8);
          playSfx('place');
          if (guidedActive) renderGuidedStep();
          if (selectedBlockId === 'crayon' && countBlocksOfType('crayon') >= 4) {
            if (typeof awardBadge === 'function') awardBadge('artist', true);
          }
        }
      }

      let isPointerDown = false;
      let startX = 0;
      let startY = 0;
      let lastX = 0;
      let lastY = 0;
      let draggedDistance = 0;
      let downTimestamp = 0;
      let initialPinchDist = null;
      let initialPinchRadius = camRadius;

      const domElem = renderer.domElement;

      domElem.addEventListener('pointerdown', (e) => {
        isPointerDown = true;
        startX = lastX = e.clientX;
        startY = lastY = e.clientY;
        draggedDistance = 0;
        downTimestamp = performance.now();
      });

      window.addEventListener('pointermove', (e) => {
        if (isPointerDown) {
          const dx = e.clientX - lastX;
          const dy = e.clientY - lastY;
          draggedDistance += Math.hypot(dx, dy);
          lastX = e.clientX;
          lastY = e.clientY;

          if (draggedDistance > 8) {
            camTheta -= dx * 0.0085;
            camPhi -= dy * 0.007;
            updateCameraPosition();
          }
        } else {
          const rect = domElem.getBoundingClientRect();
          pointerNDC.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
          pointerNDC.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
          raycaster.setFromCamera(pointerNDC, camera);
          const hits = raycaster.intersectObjects(getRaycastTargets(), true);
          if (hits.length > 0) {
            const info = findRootObjectData(hits[0].object);
            if (info && info.data && info.data.gx !== undefined) {
              const normal = hits[0].face ? hits[0].face.normal.clone() : new THREE.Vector3(0, 1, 0);
              normal.transformDirection(hits[0].object.matrixWorld).round();
              const gx = currentMode === 'erase' ? info.data.gx : info.data.gx + normal.x;
              const gy = currentMode === 'erase' ? info.data.gy : info.data.gy + normal.y;
              const gz = currentMode === 'erase' ? info.data.gz : info.data.gz + normal.z;
              if (gx >= MIN_COORD && gx <= MAX_COORD && gz >= MIN_COORD && gz <= MAX_COORD && gy >= 1 && gy <= MAX_HEIGHT) {
                previewMesh.visible = true;
                previewMesh.position.set(gx + 0.5, gy + 0.5, gz + 0.5);
                return;
              }
            }
          }
          previewMesh.visible = false;
        }
      });

      window.addEventListener('pointerup', (e) => {
        if (!isPointerDown) return;
        isPointerDown = false;
        const elapsed = performance.now() - downTimestamp;
        if (draggedDistance < 14 && elapsed < 450 && e.target === domElem) {
          handleWorldTap(e.clientX, e.clientY);
        }
      });

      domElem.addEventListener('touchstart', (e) => {
        if (e.touches.length === 2) {
          const dx = e.touches[0].clientX - e.touches[1].clientX;
          const dy = e.touches[0].clientY - e.touches[1].clientY;
          initialPinchDist = Math.hypot(dx, dy);
          initialPinchRadius = camRadius;
        }
      }, { passive: true });

      domElem.addEventListener('touchmove', (e) => {
        if (e.touches.length === 2 && initialPinchDist) {
          const dx = e.touches[0].clientX - e.touches[1].clientX;
          const dy = e.touches[0].clientY - e.touches[1].clientY;
          const dist = Math.hypot(dx, dy);
          const scale = initialPinchDist / Math.max(20, dist);
          camRadius = initialPinchRadius * scale;
          updateCameraPosition();
        }
      }, { passive: true });

      domElem.addEventListener('touchend', () => {
        initialPinchDist = null;
      }, { passive: true });

      domElem.addEventListener('wheel', (e) => {
        e.preventDefault();
        camRadius += e.deltaY * 0.01;
        updateCameraPosition();
      }, { passive: false });

      // ==========================================
      // 11. LOCALSTORAGE SAVE SLOTS & STARTER WORLD
      // ==========================================
      function serializeWorld() {
        const arr = [];
        userBlocks.forEach((val, key) => {
          const [gx, gy, gz] = parseKey(key);
          arr.push([gx, gy, gz, val.type]);
        });
        return JSON.stringify(arr);
      }

      function deserializeWorld(jsonStr) {
        userBlocks.forEach((val) => {
          worldGroup.remove(val.mesh);
          if (val.light) worldGroup.remove(val.light);
        });
        userBlocks.clear();
        undoStack.length = 0;

        try {
          const arr = JSON.parse(jsonStr);
          if (Array.isArray(arr)) {
            arr.forEach(([gx, gy, gz, type]) => {
              setBlockSilent(gx, gy, gz, type);
            });
          }
        } catch (e) {}
        updateBlockCounter();
      }

      function autoSaveCurrentWorld() {
        try {
          localStorage.setItem('minicraft_kids_autosave', serializeWorld());
        } catch (e) {}
      }

      function refreshSlotBadges() {
        [1, 2, 3].forEach(slot => {
          const el = document.getElementById(`slot-status-${slot}`);
          if (!el) return;
          try {
            const raw = localStorage.getItem(`minicraft_kids_slot_${slot}`);
            if (raw) {
              const parsed = JSON.parse(raw);
              el.textContent = `已存 ${parsed.length} 顆`;
              el.className = 'text-[10px] font-extrabold text-emerald-600';
            } else {
              el.textContent = '空盒子';
              el.className = 'text-[10px] font-bold text-slate-400';
            }
          } catch (e) {
            el.textContent = '空盒子';
          }
        });
      }

      function buildStarterWelcomeWorld() {
        deserializeWorld('[]');
        const items = getBlueprintBlocks('cabin', 0, -1);
        items.forEach(item => {
          setBlockSilent(item.gx, item.gy, item.gz, item.type);
        });
        setBlockSilent(-1, 1, 3, 'flower');
        setBlockSilent(1, 1, 3, 'flower');
        setBlockSilent(-2, 1, 3, 'grass');
        setBlockSilent(2, 1, 3, 'grass');
        setBlockSilent(3, 1, 2, 'lamp');
        setBlockSilent(-4, 1, 2, 'water');
        setBlockSilent(-4, 1, 3, 'water');
        setBlockSilent(3, 1, 3, 'soft_mat');

        while (mobs.length > 0) {
          const m = mobs.pop();
          scene.remove(m.mesh);
        }
        spawnMobAt('pig', -3, 2, true);
        spawnMobAt('chicken', 2, 3, true);
        spawnMobAt('builder', 0, 3, true);
        autoSaveCurrentWorld();
      }

      // ==========================================
      // 12. BUTTON EVENT BINDINGS
      // ==========================================
      document.getElementById('tab-build').addEventListener('click', () => setMode('build', true));
      document.getElementById('tab-magic').addEventListener('click', () => setMode('magic', true));
      document.getElementById('tab-mob').addEventListener('click', () => setMode('mob', true));
      document.getElementById('tab-story').addEventListener('click', () => setMode('story', true));
      document.getElementById('tab-erase').addEventListener('click', () => setMode('erase', true));
      document.getElementById('btn-back-to-build').addEventListener('click', () => setMode('build', true));

      document.getElementById('btn-badges').addEventListener('click', () => openBadgeModal());
      document.getElementById('btn-open-badges-from-story').addEventListener('click', () => openBadgeModal());
      document.getElementById('btn-close-badge-modal').addEventListener('click', () => {
        document.getElementById('badge-modal').classList.add('hidden');
      });
      document.getElementById('btn-story-close').addEventListener('click', () => stopStory());
      document.querySelectorAll('.story-pick-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const sid = btn.getAttribute('data-story');
          document.querySelectorAll('.story-pick-btn').forEach(b => b.classList.remove('kid-btn-selected'));
          btn.classList.add('kid-btn-selected');
          startStory(sid);
        });
      });

      document.getElementById('btn-toggle-dock').addEventListener('click', () => {
        toggleBottomDock();
        playSfx('place');
      });

      document.getElementById('btn-toggle-cam-drawer').addEventListener('click', () => {
        const drawer = document.getElementById('cam-drawer');
        if (drawer) {
          drawer.classList.toggle('hidden');
          playSfx('place');
        }
      });

      document.getElementById('btn-mascot-tip').addEventListener('click', () => {
        const msg = document.getElementById('coach-message').textContent;
        playSfx('magic');
        speakCoach(msg, false);
      });

      document.getElementById('btn-undo').addEventListener('click', () => undoLastAction());
      document.getElementById('btn-fireworks').addEventListener('click', () => launchFireworks());

      document.getElementById('btn-sound').addEventListener('click', () => {
        soundEnabled = !soundEnabled;
        document.getElementById('sound-icon').textContent = soundEnabled ? '🔊' : '🔇';
        document.getElementById('sound-label').textContent = soundEnabled ? '語音開' : '靜音';
        if (soundEnabled) {
          playSfx('place');
          speakCoach('語音小幫手打開囉！');
        }
      });

      document.getElementById('btn-sky').addEventListener('click', () => {
        skyState = (skyState + 1) % 3;
        const skyIcon = document.getElementById('sky-icon');
        const skyLabel = document.getElementById('sky-label');
        if (skyState === 0) {
          scene.background.setHex(0x7dd3fc);
          scene.fog.color.setHex(0x7dd3fc);
          ambientLight.intensity = 0.78;
          dirLight.intensity = 0.85;
          dirLight.color.setHex(0xfffbeb);
          celestialMat.color.setHex(0xfde047);
          skyIcon.textContent = '🌞';
          skyLabel.textContent = '白天';
          speakCoach('太陽出來囉！晴朗的白天！');
        } else if (skyState === 1) {
          scene.background.setHex(0xfb923c);
          scene.fog.color.setHex(0xfb923c);
          ambientLight.intensity = 0.62;
          dirLight.intensity = 0.72;
          dirLight.color.setHex(0xfed7aa);
          celestialMat.color.setHex(0xf97316);
          skyIcon.textContent = '🌅';
          skyLabel.textContent = '夕陽';
          speakCoach('好美的橘色夕陽喔！');
        } else {
          scene.background.setHex(0x1e1b4b);
          scene.fog.color.setHex(0x1e1b4b);
          ambientLight.intensity = 0.35;
          dirLight.intensity = 0.28;
          dirLight.color.setHex(0x93c5fd);
          celestialMat.color.setHex(0xfef08a);
          skyIcon.textContent = '🌙';
          skyLabel.textContent = '夜晚';
          speakCoach('晚上到了！你看，房子的發光燈亮起來囉！');
        }
        playSfx('magic');
      });

      document.getElementById('btn-rot-left').addEventListener('click', () => {
        camTheta -= Math.PI / 6;
        updateCameraPosition();
        playSfx('place');
      });
      document.getElementById('btn-rot-right').addEventListener('click', () => {
        camTheta += Math.PI / 6;
        updateCameraPosition();
        playSfx('place');
      });
      document.getElementById('btn-zoom-in').addEventListener('click', () => {
        camRadius -= 2.2;
        updateCameraPosition();
        playSfx('place');
      });
      document.getElementById('btn-zoom-out').addEventListener('click', () => {
        camRadius += 2.2;
        updateCameraPosition();
        playSfx('place');
      });
      document.getElementById('btn-cam-reset').addEventListener('click', () => {
        camTheta = Math.PI * 0.22;
        camPhi = Math.PI * 0.30;
        camRadius = 16.5;
        updateCameraPosition();
        playSfx('place');
        speakCoach('鏡頭回正囉！');
      });

      document.getElementById('btn-guided-mode').addEventListener('click', () => {
        guidedActive = !guidedActive;
        if (guidedActive) {
          guidedStep = 0;
          deserializeWorld('[]');
          renderGuidedStep();
          playSfx('magic');
          speakCoach('跟著亮光蓋房子！點亮晶晶的黃色方塊，或是點「幫我放這一步」喔！');
        } else {
          renderGuidedStep();
          speakCoach('切換回自由蓋房子模式！');
        }
      });

      document.getElementById('btn-guided-auto-step').addEventListener('click', () => {
        completeCurrentGuidedStep();
      });

      document.getElementById('btn-guided-close').addEventListener('click', () => {
        guidedActive = false;
        renderGuidedStep();
      });

      document.getElementById('btn-brush-size').addEventListener('click', () => {
        brushSize = brushSize === 1 ? 2 : 1;
        const iconEl = document.getElementById('brush-icon');
        const lblEl = document.getElementById('brush-label');
        if (brushSize === 2) {
          iconEl.textContent = '🧱';
          lblEl.textContent = '2×2';
          speakCoach('變成大塊積木！一次可以放四顆喔！');
        } else {
          iconEl.textContent = '🧱';
          lblEl.textContent = '1×1';
          speakCoach('變成單顆積木！');
        }
        playSfx('place');
      });

      document.querySelectorAll('.magic-stamp-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const stamp = btn.getAttribute('data-stamp');
          selectedStampId = stamp;
          document.querySelectorAll('.magic-stamp-btn').forEach(b => b.classList.remove('kid-btn-selected'));
          btn.classList.add('kid-btn-selected');
          applyMagicStamp(stamp, 0, 0);
        });
      });

      document.querySelectorAll('.mob-spawn-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const mobType = btn.getAttribute('data-mob');
          selectedMobId = mobType;
          document.querySelectorAll('.mob-spawn-btn').forEach(b => b.classList.remove('kid-btn-selected'));
          btn.classList.add('kid-btn-selected');
          const rx = Math.floor((Math.random() - 0.5) * 6);
          const rz = Math.floor(2 + Math.random() * 3);
          spawnMobAt(mobType, rx, rz, false);
        });
      });

      document.getElementById('btn-clear-mobs').addEventListener('click', () => {
        clearAllMobs();
      });

      const houseModal = document.getElementById('house-modal');
      document.getElementById('btn-menu').addEventListener('click', () => {
        refreshSlotBadges();
        houseModal.classList.remove('hidden');
        playSfx('place');
        speakCoach('打開我的魔法房子盒！');
      });

      document.getElementById('btn-close-modal').addEventListener('click', () => {
        houseModal.classList.add('hidden');
      });

      document.querySelectorAll('.slot-save-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const slot = btn.getAttribute('data-save-slot');
          try {
            localStorage.setItem(`minicraft_kids_slot_${slot}`, serializeWorld());
          } catch (e) {}
          refreshSlotBadges();
          playSfx('magic');
          speakCoach(`已經把房子收進 ${slot} 號盒子囉！`);
        });
      });

      document.querySelectorAll('.slot-load-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const slot = btn.getAttribute('data-load-slot');
          try {
            const saved = localStorage.getItem(`minicraft_kids_slot_${slot}`);
            if (!saved) {
              speakCoach(`${slot} 號盒子還是空的喔！先按存起來吧！`);
              return;
            }
            deserializeWorld(saved);
            houseModal.classList.add('hidden');
            playSfx('magic');
            speakCoach(`打開 ${slot} 號盒子裡的房子囉！`);
          } catch (e) {}
        });
      });

      document.getElementById('btn-reset-starter').addEventListener('click', () => {
        guidedActive = false;
        renderGuidedStep();
        buildStarterWelcomeWorld();
        houseModal.classList.add('hidden');
        launchFireworks();
      });

      document.getElementById('btn-clear-island').addEventListener('click', () => {
        guidedActive = false;
        renderGuidedStep();
        deserializeWorld('[]');
        houseModal.classList.add('hidden');
        playSfx('magic');
        speakCoach('小島變成乾淨的綠草地囉！快來蓋你的新房子吧！');
      });

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      // ==========================================
      // 13. MAIN ANIMATION LOOP
      // ==========================================
      let lastTime = performance.now();
      let animFrameId = null;

      const btnPhysicsWave = document.getElementById('btn-physics-wave');
      if (btnPhysicsWave) {
        btnPhysicsWave.addEventListener('click', () => {
          ensureAudio();
          playSfx('splash');
          setTimeout(() => playSfx('boing'), 180);
          // Bounce all mobs high into the air & splash water particles!
          mobs.forEach(m => {
            m.bounceVy = 6.8;
            spawnBlockParticles(m.mesh.position.x, m.mesh.position.y + 0.5, m.mesh.position.z, 0x38bdf8, 8);
          });
          // Drop a fun waterfall + bouncy mat + sand demo on an open spot if user hasn't placed water yet
          if (countBlocksOfType('water') === 0) {
            setBlockSilent(-4, 1, 2, 'water');
            scheduleWaterFlow(-4, 1, 2, 0);
          }
          if (countBlocksOfType('soft_mat') === 0) {
            setBlockSilent(2, 1, 2, 'soft_mat');
          }
          applySandGravity(2, 5, 2);
          speakCoach('哇！水流波動、重力黃沙跟彈跳床物理特效啟動囉！');
        });
      }

      function animate(now) {
        animFrameId = requestAnimationFrame(animate);
        const dt = Math.min(0.05, (now - lastTime) / 1000);
        lastTime = now;

        userBlocks.forEach(entry => {
          const u = entry.mesh.userData;
          if (!u) return;
          if (u.animScale !== undefined && u.animScale < 1) {
            u.animScale = Math.min(1, u.animScale + dt * 5.5);
            const overshoot = u.animScale < 0.85 ? u.animScale * 1.12 : 1.0;
            const sy = u.waterScaleY ? overshoot * u.waterScaleY : overshoot;
            entry.mesh.scale.set(overshoot, sy, overshoot);
          }
          // Sway 3D grass blades & 3D flowers gently in the wind
          if (u.swayGroup) {
            u.swayGroup.rotation.z = Math.sin(now * 0.0032 + u.gx * 0.8 + u.gz * 0.8) * 0.085;
            u.swayGroup.rotation.x = Math.cos(now * 0.0026 + u.gx * 0.6) * 0.055;
          }
          // Dynamic 3D water wave bobbing & foam shimmer
          if (u.type === 'water') {
            const waveOffset = Math.sin(now * 0.0045 + u.gx * 0.9 + u.gz * 0.9) * 0.055;
            entry.mesh.position.y = u.gy + 0.45 + waveOffset;
            if (u.foam1 && u.foam2) {
              u.foam1.position.x = -0.14 + Math.sin(now * 0.003 + u.gx) * 0.08;
              u.foam2.position.x = 0.16 + Math.cos(now * 0.003 + u.gz) * 0.08;
            }
          }
          // Gravity falling physics (e.g., sand blocks falling from height & bouncing on soft_mat)
          if (u.fallY !== undefined) {
            const targetY = u.gy + 0.5;
            u.fallVel = (u.fallVel || 0) - 18.0 * dt;
            u.fallY += u.fallVel * dt;
            if (u.fallY <= targetY) {
              if (u.bounceOnLand) {
                u.fallY = targetY;
                u.fallVel = 7.2;
                u.bounceOnLand = false;
                playSfx('boing');
                spawnBlockParticles(u.gx + 0.5, targetY, u.gz + 0.5, 0xf472b6, 10);
              } else {
                u.fallY = undefined;
                u.fallVel = 0;
                entry.mesh.position.y = targetY;
                playSfx('place');
                spawnBlockParticles(u.gx + 0.5, targetY - 0.3, u.gz + 0.5, 0xfde047, 8);
              }
            } else {
              entry.mesh.position.y = u.fallY;
            }
          }
        });

        if (guidedActive) {
          const pulse = 0.88 + Math.sin(now * 0.006) * 0.08;
          guidedGhostGroup.children.forEach(g => {
            g.scale.set(pulse, pulse, pulse);
          });
        }

        clouds.forEach(c => {
          c.mesh.position.x += c.speed * dt;
          if (c.mesh.position.x > 18) c.mesh.position.x = -18;
        });

        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.life -= dt;
          if (p.life <= 0) {
            scene.remove(p.mesh);
            particles.splice(i, 1);
          } else {
            p.vy -= 9.8 * dt;
            p.mesh.position.x += p.vx * dt;
            p.mesh.position.y += p.vy * dt;
            p.mesh.position.z += p.vz * dt;
            p.mesh.rotation.x += 4 * dt;
            p.mesh.rotation.y += 4 * dt;
            const s = Math.max(0.05, p.life * 1.4);
            p.mesh.scale.set(s, s, s);
          }
        }

        mobs.forEach(m => {
          m.timer -= dt;
          if (m.timer <= 0) {
            m.angle += (Math.random() - 0.5) * 2.2;
            m.timer = 1.2 + Math.random() * 2.0;
          }
          m.hopPhase += dt * 7;
          const speed = 0.75;
          const nx = m.mesh.position.x + Math.sin(m.angle) * speed * dt;
          const nz = m.mesh.position.z + Math.cos(m.angle) * speed * dt;

          if (nx > MIN_COORD + 0.8 && nx < MAX_COORD + 0.2 && nz > MIN_COORD + 0.8 && nz < MAX_COORD + 0.2) {
            const gx = Math.floor(nx);
            const gz = Math.floor(nz);
            const surfaceY = getTopSurfaceY(gx, gz);
            const topBlock = userBlocks.get(posKey(gx, surfaceY - 1, gz));
            const topType = topBlock ? topBlock.type : null;

            if (surfaceY <= 3) {
              m.mesh.position.x = nx;
              m.mesh.position.z = nz;
              m.mesh.rotation.y = m.angle;

              // Check if mob stepped onto a bouncy soft_mat
              if (topType === 'soft_mat' && (!m.bounceVy || m.bounceVy <= 0.1)) {
                m.bounceVy = 6.2;
                m.bounceY = surfaceY;
                playSfx('boing');
                spawnBlockParticles(nx, surfaceY + 0.2, nz, 0xf472b6, 8);
              }

              if (m.bounceVy !== undefined && (m.bounceVy > 0 || (m.bounceY !== undefined && m.bounceY > surfaceY))) {
                m.bounceY = (m.bounceY || surfaceY) + m.bounceVy * dt;
                m.bounceVy -= 15.0 * dt;
                if (m.bounceY <= surfaceY) {
                  m.bounceY = surfaceY;
                  m.bounceVy = 0;
                }
                m.mesh.position.y = m.bounceY;
              } else if (topType === 'water') {
                // Swimming in water! Bob gently in the water & splash droplets
                m.mesh.position.y = (surfaceY - 0.55) + Math.sin(now * 0.007 + m.hopPhase) * 0.09;
                if (Math.random() < 0.06) {
                  spawnBlockParticles(nx, surfaceY - 0.1, nz, 0x38bdf8, 3);
                }
              } else {
                m.mesh.position.y = surfaceY + Math.abs(Math.sin(m.hopPhase)) * 0.14;
              }
            } else {
              m.angle += Math.PI * 0.75;
            }
          } else {
            m.angle += Math.PI * 0.8;
          }
        });

        renderer.render(scene, camera);
      }

      window.onload = function () {
        initTextures();
        buildIslandBase();
        renderBlockPalette();
        loadEarnedBadges();
        renderBadgeGrid();
        document.getElementById('brush-icon').textContent = '🧱';

        let loaded = false;
        try {
          const saved = localStorage.getItem('minicraft_kids_autosave');
          if (saved) {
            const parsed = JSON.parse(saved);
            if (Array.isArray(parsed) && parsed.length > 0) {
              deserializeWorld(saved);
              spawnMobAt('pig', -3, 2, true);
              spawnMobAt('chicken', 2, 3, true);
              loaded = true;
            }
          }
        } catch (e) {}

        if (!loaded) {
          buildStarterWelcomeWorld();
        }

        if (animFrameId) cancelAnimationFrame(animFrameId);
        lastTime = performance.now();
        animFrameId = requestAnimationFrame(animate);
      };
    })();
  </script>
</body>
</html>

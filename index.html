<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <link rel="icon" href="data:,">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>小小麥塊蓋房子 - 5歲寶寶快樂建築世界</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Noto Sans TC', 'Inter', sans-serif;
      background: #7dd3fc;
      touch-action: none;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    .kid-btn {
      transition: transform 0.12s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.12s ease, background-color 0.15s ease, opacity 0.2s ease;
    }
    .kid-btn:active {
      transform: translateY(2px) scale(0.94);
    }
    .kid-btn-selected {
      transform: translateY(-2px) scale(1.05);
      box-shadow: 0 0 0 3px #fde047, 0 4px 10px rgba(0,0,0,0.25);
    }
    html, body {
      height: 100vh;
      height: 100dvh;
    }
    header {
      top: max(6px, env(safe-area-inset-top)) !important;
    }
    footer {
      bottom: max(6px, env(safe-area-inset-bottom)) !important;
    }
    @keyframes kidToastPop {
      0% { transform: translateY(-8px) scale(0.9); opacity: 0; }
      100% { transform: translateY(0) scale(1); opacity: 1; }
    }
    .kid-toast-pop {
      animation: kidToastPop 0.18s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }
    /* Keep both menu bar and block bar labels readable on all screens; only slightly tighten height on very short landscape phones */
    @media (max-height: 440px) {
      .block-item-btn {
        width: 46px !important;
        height: 44px !important;
      }
    }
  </style>
</head>
<body class="relative w-screen h-screen overflow-hidden select-none">

  <!-- 3D Voxel World Container (100% Full Viewport) -->
  <div id="canvas-container" class="absolute inset-0 w-full h-full z-0 cursor-pointer"></div>

  <!-- Ultra-Slim Top Floating Corner Pills (Leaves Center Sky Open) -->
  <header class="fixed top-1.5 left-1.5 right-1.5 z-20 pointer-events-none flex flex-col gap-1">
    <div class="flex items-center justify-between gap-1 w-full">

      <!-- Top-Left: Mini Mascot Coach Pill -->
      <button id="btn-mascot-tip" type="button"
        class="pointer-events-auto kid-btn flex items-center gap-1.5 bg-white/85 hover:bg-white backdrop-blur-sm border-2 border-amber-400 rounded-full pl-1 pr-2.5 py-0.5 shadow-md max-w-[46%] sm:max-w-xs text-left">
        <span class="w-7 h-7 rounded-full bg-amber-300 border-2 border-amber-500 flex items-center justify-center text-base flex-shrink-0 shadow-sm" aria-hidden="true">👷</span>
        <div class="min-w-0 flex items-center gap-1">
          <span class="sr-only">👷 麥塊小幫手</span>
          <span id="block-counter-badge" class="text-[10px] font-black bg-emerald-100 text-emerald-800 px-1.5 py-0.2 rounded-full flex-shrink-0">0 顆</span>
          <p id="coach-message" class="text-[11px] sm:text-xs font-extrabold text-slate-800 truncate">
            點草地放積木，或點「魔法蓋房」喔！
          </p>
        </div>
      </button>

      <!-- Top-Right: Compact Circular Quick Action Pills -->
      <div class="pointer-events-auto flex items-center gap-1 bg-slate-900/60 backdrop-blur-md p-1 rounded-full border border-white/20 shadow-md max-w-[54%] sm:max-w-none overflow-x-auto no-scrollbar">
        <button id="btn-guided-mode" type="button" title="跟著亮光蓋房子"
          class="kid-btn bg-yellow-300 hover:bg-yellow-200 text-slate-900 rounded-full w-8 h-8 sm:w-9 sm:h-9 flex items-center justify-center shadow-sm">
          <span class="text-sm sm:text-base leading-none">👣</span>
          <span class="sr-only">跟著亮光蓋</span>
        </button>

        <button id="btn-brush-size" type="button" title="切換單顆或2x2大積木"
          class="kid-btn bg-indigo-500 hover:bg-indigo-400 text-white rounded-full h-8 sm:h-9 px-2 flex items-center justify-center gap-0.5 shadow-sm">
          <span id="brush-icon" class="text-xs sm:text-sm leading-none">CUBE</span>
          <span id="brush-label" class="text-[10px] font-black leading-none"><span class="sr-only">單顆</span>1×1</span>
        </button>

        <button id="btn-undo" type="button" title="復原上一步"
          class="kid-btn bg-amber-400 hover:bg-amber-300 text-slate-900 rounded-full w-8 h-8 sm:w-9 sm:h-9 flex items-center justify-center shadow-sm">
          <span class="text-sm sm:text-base leading-none">↩️</span>
          <span class="sr-only">復原</span>
        </button>

        <button id="btn-sky" type="button" title="切換白天與夜晚"
          class="kid-btn bg-sky-400 hover:bg-sky-300 text-white rounded-full w-8 h-8 sm:w-9 sm:h-9 flex items-center justify-center shadow-sm">
          <span id="sky-icon" class="text-sm sm:text-base leading-none">🌞</span>
          <span id="sky-label" class="sr-only">白天</span>
        </button>

        <a href="./fun-park/" title="阿奇小隊歡樂遊樂園 (Mureka 兒歌)"
          class="kid-btn bg-rose-500 hover:bg-rose-400 text-white rounded-full h-8 sm:h-9 px-2 flex items-center justify-center gap-0.5 shadow-sm no-underline font-black text-[11px]">
          <span class="text-sm sm:text-base leading-none">🎡</span>
          <span class="hidden sm:inline">遊樂園</span>
        </a>

        <button id="btn-physics-wave" type="button" title="水花與彈跳物理派對"
          class="kid-btn bg-cyan-500 hover:bg-cyan-400 text-white rounded-full w-8 h-8 sm:w-9 sm:h-9 flex items-center justify-center shadow-sm">
          <span class="text-sm sm:text-base leading-none">🌊</span>
          <span class="sr-only">物理特效</span>
        </button>

        <button id="btn-fireworks" type="button" title="放煙火慶祝"
          class="kid-btn bg-pink-500 hover:bg-pink-400 text-white rounded-full w-8 h-8 sm:w-9 sm:h-9 flex items-center justify-center shadow-sm">
          <span class="text-sm sm:text-base leading-none">🎉</span>
          <span class="sr-only">煙火</span>
        </button>

        <button id="btn-badges" type="button" title="我的徽章"
          class="kid-btn bg-violet-500 hover:bg-violet-400 text-white rounded-full w-8 h-8 sm:w-9 sm:h-9 flex items-center justify-center shadow-sm">
          <span class="text-sm sm:text-base leading-none">🏅</span>
          <span class="sr-only">徽章</span>
        </button>

        <button id="btn-sound" type="button" title="語音與音效開關"
          class="kid-btn bg-emerald-500 hover:bg-emerald-400 text-white rounded-full w-8 h-8 sm:w-9 sm:h-9 flex items-center justify-center shadow-sm">
          <span id="sound-icon" class="text-sm sm:text-base leading-none">🔊</span>
          <span id="sound-label" class="sr-only">語音開</span>
        </button>

        <button id="btn-toggle-cam-drawer" type="button" title="展開/收起鏡頭按鈕"
          class="kid-btn bg-white/90 hover:bg-white text-slate-800 rounded-full w-8 h-8 sm:w-9 sm:h-9 flex items-center justify-center shadow-sm">
          <span class="text-sm sm:text-base leading-none">🎥</span>
        </button>

        <button id="btn-menu" type="button" title="房子存檔盒與重來"
          class="kid-btn bg-violet-500 hover:bg-violet-400 text-white rounded-full w-8 h-8 sm:w-9 sm:h-9 flex items-center justify-center shadow-sm">
          <span class="text-sm sm:text-base leading-none">💾</span>
          <span class="sr-only">房子盒</span>
        </button>
      </div>
    </div>

    <!-- Collapsible Camera Mini-Bar (Hidden by default so screen edges stay 100% clear; opened via 🎥 button) -->
    <div id="cam-drawer" class="hidden pointer-events-auto self-end bg-slate-900/75 backdrop-blur-md border border-white/25 rounded-full px-2 py-1 flex items-center gap-1 shadow-lg">
      <button id="btn-rot-left" type="button" title="向左轉看房子"
        class="kid-btn bg-white/90 hover:bg-white text-slate-800 rounded-full px-2 py-1 text-[11px] font-black flex items-center gap-0.5">
        <span>↪️</span>
        <span>左轉</span>
      </button>
      <button id="btn-rot-right" type="button" title="向右轉看房子"
        class="kid-btn bg-white/90 hover:bg-white text-slate-800 rounded-full px-2 py-1 text-[11px] font-black flex items-center gap-0.5">
        <span>↩️</span>
        <span>右轉</span>
      </button>
      <button id="btn-zoom-in" type="button" title="拉近放大"
        class="kid-btn bg-white/90 hover:bg-white text-slate-800 rounded-full px-2 py-1 text-[11px] font-black flex items-center gap-0.5">
        <span>➕</span>
        <span>放大</span>
      </button>
      <button id="btn-zoom-out" type="button" title="拉遠縮小"
        class="kid-btn bg-white/90 hover:bg-white text-slate-800 rounded-full px-2 py-1 text-[11px] font-black flex items-center gap-0.5">
        <span>➖</span>
        <span>縮小</span>
      </button>
      <button id="btn-cam-reset" type="button" title="鏡頭回正"
        class="kid-btn bg-amber-300 hover:bg-amber-200 text-slate-900 rounded-full px-2 py-1 text-[11px] font-black flex items-center gap-0.5">
        <span>🎯</span>
        <span>回正</span>
      </button>
    </div>

    <!-- Step-by-Step Guided Mode Slim Banner (Hidden unless Guided Mode is active) -->
    <div id="guided-banner" class="hidden pointer-events-auto max-w-md mx-auto w-full bg-amber-300/95 backdrop-blur-sm border-2 border-white rounded-full px-3 py-1 shadow-md flex items-center justify-between gap-2">
      <div class="flex items-center gap-1.5 min-w-0 flex-1">
        <span class="text-sm animate-bounce">🌟</span>
        <div class="min-w-0 flex-1">
          <div id="guided-step-title" class="text-[11px] font-black text-slate-900 truncate">
            跟著亮光蓋房子：第 1 步（鋪地板與圍牆）
          </div>
          <div class="w-full bg-white/70 h-1.5 rounded-full overflow-hidden">
            <div id="guided-progress-bar" class="bg-emerald-500 h-full transition-all duration-300" style="width: 25%"></div>
          </div>
        </div>
      </div>
      <div class="flex items-center gap-1 flex-shrink-0">
        <button id="btn-guided-auto-step" type="button"
          class="kid-btn bg-emerald-500 hover:bg-emerald-400 text-white font-black text-[11px] px-2 py-0.5 rounded-full shadow">
          ✨ 幫我放這一步
        </button>
        <button id="btn-guided-close" type="button"
          class="kid-btn bg-rose-500 hover:bg-rose-400 text-white font-black text-[10px] w-5 h-5 rounded-full flex items-center justify-center">
          ✖
        </button>
      </div>
    </div>

    <!-- Kindergarten Story Mode Banner -->
    <div id="story-banner" class="hidden pointer-events-auto max-w-md mx-auto w-full bg-violet-300/95 backdrop-blur-sm border-2 border-white rounded-full px-3 py-1 shadow-md flex items-center justify-between gap-2">
      <div class="flex items-center gap-1.5 min-w-0 flex-1">
        <span class="text-sm animate-bounce">🏫</span>
        <div class="min-w-0 flex-1">
          <div id="story-step-title" class="text-[11px] font-black text-slate-900 truncate">
            幼幼園情節：開心上學日
          </div>
          <div class="w-full bg-white/70 h-1.5 rounded-full overflow-hidden">
            <div id="story-progress-bar" class="bg-violet-600 h-full transition-all duration-300" style="width: 0%"></div>
          </div>
          <div id="story-step-hint" class="text-[10px] font-bold text-violet-950/80 truncate">目標進度 0/3</div>
        </div>
      </div>
      <div class="flex items-center gap-1 flex-shrink-0">
        <button id="btn-story-close" type="button"
          class="kid-btn bg-rose-500 hover:bg-rose-400 text-white font-black text-[10px] w-5 h-5 rounded-full flex items-center justify-center">
          ✖
        </button>
      </div>
    </div>

    <!-- Big Chinese Voice & Tap Notification Toast Pill -->
    <div id="kid-toast-banner" class="pointer-events-none self-center bg-amber-300/95 text-slate-900 border-2 border-white rounded-full px-4 py-1 shadow-lg flex items-center gap-2 text-xs sm:text-sm font-black tracking-wide transition-all duration-200">
      <span id="kid-toast-emoji" class="text-base sm:text-lg leading-none">🧱</span>
      <span id="kid-toast-text">點下方積木或點草地開始蓋房子喔！</span>
    </div>
  </header>

  <!-- Ultra-Compact Collapsible Bottom Dock -->
  <footer class="fixed bottom-1.5 left-1.5 right-1.5 z-20 pointer-events-none flex flex-col items-center">
    <!-- Floating Collapse/Expand Handle Pill -->
    <div class="w-full max-w-3xl flex justify-end pr-2 mb-0.5">
      <button id="btn-toggle-dock" type="button"
        class="pointer-events-auto kid-btn bg-slate-900/75 hover:bg-slate-900 text-white/95 border border-white/25 rounded-full px-2.5 py-0.5 text-[11px] font-extrabold shadow flex items-center gap-1 backdrop-blur-sm">
        <span id="dock-toggle-icon">🔽</span>
        <span id="dock-toggle-text">收起工具</span>
      </button>
    </div>

    <!-- Main Dock Container (Menu Bar ALWAYS Visible + Scrollable Item Bar) -->
    <div id="bottom-dock-body" class="max-w-3xl w-full pointer-events-auto bg-slate-900/85 backdrop-blur-md border border-white/25 rounded-2xl p-1.5 sm:p-2 shadow-xl transition-all duration-200">
      <div id="bottom-dock-inner" class="flex flex-col gap-1.5">

        <!-- Compact Mode Selector Pills -->
        <div id="mode-tabs-row" class="grid grid-cols-5 gap-1">
          <button id="tab-build" type="button"
            class="mode-tab-btn kid-btn flex items-center justify-center gap-1 py-1 px-1.5 rounded-xl font-black text-[11px] sm:text-xs bg-emerald-500 text-white ring-2 ring-yellow-300 shadow-sm">
            <span class="text-sm sm:text-base">🧱</span>
            <span class="mode-tab-text">蓋積木</span>
          </button>

          <button id="tab-magic" type="button"
            class="mode-tab-btn kid-btn flex items-center justify-center gap-1 py-1 px-1.5 rounded-xl font-black text-[11px] sm:text-xs bg-purple-500/90 hover:bg-purple-500 text-white shadow-sm">
            <span class="text-sm sm:text-base">🪄</span>
            <span class="mode-tab-text">魔法蓋房</span>
          </button>

          <button id="tab-mob" type="button"
            class="mode-tab-btn kid-btn flex items-center justify-center gap-1 py-1 px-1.5 rounded-xl font-black text-[11px] sm:text-xs bg-amber-500/90 hover:bg-amber-500 text-white shadow-sm">
            <span class="text-sm sm:text-base">🐣</span>
            <span class="mode-tab-text">小動物</span>
          </button>

          <button id="tab-story" type="button"
            class="mode-tab-btn kid-btn flex items-center justify-center gap-1 py-1 px-1.5 rounded-xl font-black text-[11px] sm:text-xs bg-violet-500/90 hover:bg-violet-500 text-white shadow-sm">
            <span class="text-sm sm:text-base">🏫</span>
            <span class="mode-tab-text">情節</span>
          </button>

          <button id="tab-erase" type="button"
            class="mode-tab-btn kid-btn flex items-center justify-center gap-1 py-1 px-1.5 rounded-xl font-black text-[11px] sm:text-xs bg-rose-500/90 hover:bg-rose-500 text-white shadow-sm">
            <span class="text-sm sm:text-base">🔨</span>
            <span class="mode-tab-text">敲敲槌</span>
          </button>
        </div>

        <!-- Dynamic Sub-Tray: Panel 1 - Block Palette -->
        <div id="panel-build" class="flex items-center gap-1.5 overflow-x-auto no-scrollbar py-0.5 px-0.5 flex-1">
          <!-- Populated dynamically with compact procedural block preview icons -->
        </div>

        <!-- Dynamic Sub-Tray: Panel 2 - 1-Tap Magic House & Room Stamps -->
        <div id="panel-magic" class="hidden flex items-center gap-1.5 overflow-x-auto no-scrollbar py-0.5 px-0.5 flex-1">
          <button type="button" data-stamp="cabin"
            class="magic-stamp-btn kid-btn flex-shrink-0 flex items-center gap-1.5 bg-gradient-to-b from-amber-400 to-orange-500 text-white font-black px-2.5 py-1 rounded-xl border-b-2 border-orange-700 shadow-sm">
            <span class="text-lg">🏡</span>
            <div class="text-left">
              <div class="text-xs leading-tight">溫馨小木屋</div>
              <div class="sr-only">點地上一鍵蓋好！</div>
            </div>
          </button>

          <button type="button" data-stamp="castle"
            class="magic-stamp-btn kid-btn flex-shrink-0 flex items-center gap-1.5 bg-gradient-to-b from-pink-400 to-rose-500 text-white font-black px-2.5 py-1 rounded-xl border-b-2 border-rose-700 shadow-sm">
            <span class="text-lg">🏰</span>
            <div class="text-left">
              <div class="text-xs leading-tight">粉紅小城堡</div>
              <div class="sr-only">有高塔與大門！</div>
            </div>
          </button>

          <button type="button" data-stamp="treehouse"
            class="magic-stamp-btn kid-btn flex-shrink-0 flex items-center gap-1.5 bg-gradient-to-b from-emerald-400 to-green-600 text-white font-black px-2.5 py-1 rounded-xl border-b-2 border-green-800 shadow-sm">
            <span class="text-lg">🌳</span>
            <div class="text-left">
              <div class="text-xs leading-tight">森林大樹屋</div>
              <div class="sr-only">大樹上的秘密基地</div>
            </div>
          </button>

          <button type="button" data-stamp="walls"
            class="magic-stamp-btn kid-btn flex-shrink-0 flex items-center gap-1.5 bg-gradient-to-b from-sky-400 to-blue-600 text-white font-black px-2.5 py-1 rounded-xl border-b-2 border-blue-800 shadow-sm">
            <span class="text-lg">🧱</span>
            <div class="text-left">
              <div class="text-xs leading-tight">自動圍牆屋</div>
              <div class="sr-only">幫你圍好牆與門窗</div>
            </div>
          </button>

          <button type="button" data-stamp="roof"
            class="magic-stamp-btn kid-btn flex-shrink-0 flex items-center gap-1.5 bg-gradient-to-b from-red-400 to-red-600 text-white font-black px-2.5 py-1 rounded-xl border-b-2 border-red-800 shadow-sm">
            <span class="text-lg">🔺</span>
            <div class="text-left">
              <div class="text-xs leading-tight">魔法尖屋頂</div>
              <div class="sr-only">自動幫房子戴帽子</div>
            </div>
          </button>

          <button type="button" data-stamp="pool"
            class="magic-stamp-btn kid-btn flex-shrink-0 flex items-center gap-1.5 bg-gradient-to-b from-cyan-400 to-teal-600 text-white font-black px-2.5 py-1 rounded-xl border-b-2 border-teal-800 shadow-sm">
            <span class="text-lg">🏊</span>
            <div class="text-left">
              <div class="text-xs leading-tight">陽光游泳池</div>
              <div class="sr-only">清澈水池與小花園</div>
            </div>
          </button>

          <button type="button" data-stamp="park"
            class="magic-stamp-btn kid-btn flex-shrink-0 flex items-center gap-1.5 bg-gradient-to-b from-yellow-400 to-amber-600 text-slate-900 font-black px-2.5 py-1 rounded-xl border-b-2 border-amber-800 shadow-sm">
            <span class="text-lg">🛝</span>
            <div class="text-left">
              <div class="text-xs leading-tight">歡樂遊樂場</div>
              <div class="sr-only">溜滑梯鞦韆與小火車</div>
            </div>
          </button>
        </div>

        <!-- Dynamic Sub-Tray: Panel 3 - Cute Blocky Mobs & Friends -->
        <div id="panel-mob" class="hidden flex items-center gap-1.5 overflow-x-auto no-scrollbar py-0.5 px-0.5 flex-1">
          <button type="button" data-mob="pig"
            class="mob-spawn-btn kid-btn flex-shrink-0 flex items-center gap-1.5 bg-pink-400 hover:bg-pink-300 text-slate-900 font-black px-2.5 py-1 rounded-xl border-b-2 border-pink-600 shadow-sm">
            <span class="text-lg">🐷</span>
            <div class="text-left">
              <div class="text-xs">粉紅小豬</div>
              <div class="sr-only">噗噗叫愛散步</div>
            </div>
          </button>

          <button type="button" data-mob="chicken"
            class="mob-spawn-btn kid-btn flex-shrink-0 flex items-center gap-1.5 bg-yellow-300 hover:bg-yellow-200 text-slate-900 font-black px-2.5 py-1 rounded-xl border-b-2 border-amber-500 shadow-sm">
            <span class="text-lg">🐥</span>
            <div class="text-left">
              <div class="text-xs">黃色小雞</div>
              <div class="sr-only">啾啾跳跳</div>
            </div>
          </button>

          <button type="button" data-mob="sheep"
            class="mob-spawn-btn kid-btn flex-shrink-0 flex items-center gap-1.5 bg-slate-100 hover:bg-white text-slate-900 font-black px-2.5 py-1 rounded-xl border-b-2 border-slate-400 shadow-sm">
            <span class="text-lg">🐑</span>
            <div class="text-left">
              <div class="text-xs">白綿羊</div>
              <div class="sr-only">咩咩軟綿綿</div>
            </div>
          </button>

      // 1. KID-FRIENDLY AUDIO & VOICE ENGINE

      let soundEnabled = true;
      let audioCtx = null;

      function ensureAudio() {
        if (!audioCtx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (AC) {
            audioCtx = new AC();
          }
        }
        if (audioCtx && audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
      }

      function playTone(freq, type, duration, delay, gainVal) {
        if (!soundEnabled) return;
        try {
          ensureAudio();
          if (!audioCtx) return;
          const now = audioCtx.currentTime + (delay || 0);
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = type || 'sine';
          osc.frequency.setValueAtTime(freq, now);
          gain.gain.setValueAtTime(gainVal || 0.14, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now);
          osc.stop(now + duration);
        } catch (e) {
          // Ignore audio errors on restricted devices
        }
      }

      function playSfx(kind) {
        if (!soundEnabled) return;
        if (kind === 'place') {
          playTone(440, 'triangle', 0.09, 0, 0.16);
          playTone(660, 'sine', 0.13, 0.05, 0.16);
        } else if (kind === 'erase') {
          playTone(300, 'sawtooth', 0.08, 0, 0.12);
          playTone(180, 'triangle', 0.14, 0.05, 0.14);
        } else if (kind === 'magic') {
          const notes = [523.25, 659.25, 783.99, 1046.5];
          notes.forEach((n, idx) => playTone(n, 'triangle', 0.18, idx * 0.06, 0.15));
        } else if (kind === 'pig') {
          playTone(220, 'sawtooth', 0.11, 0, 0.12);
          playTone(260, 'sawtooth', 0.12, 0.12, 0.12);
        } else if (kind === 'chicken') {
          playTone(880, 'sine', 0.07, 0, 0.12);
          playTone(980, 'sine', 0.08, 0.09, 0.12);
        } else if (kind === 'sheep') {
          playTone(340, 'triangle', 0.22, 0, 0.14);
          playTone(310, 'triangle', 0.25, 0.12, 0.12);
        } else if (kind === 'firework') {
          const chord = [523.25, 659.25, 783.99, 987.77, 1318.5];
          chord.forEach((n, i) => playTone(n, 'sine', 0.28, i * 0.05, 0.13));
        } else if (kind === 'splash') {
          [392, 523.25, 659.25, 783.99].forEach((n, i) => playTone(n, 'sine', 0.14, i * 0.04, 0.14));
        } else if (kind === 'boing') {
          [260, 390, 585, 880].forEach((n, i) => playTone(n, 'triangle', 0.16, i * 0.045, 0.18));
        }

            const utter = new SpeechSynthesisUtterance(cleanText);
            utter.lang = 'zh-TW';
            utter.rate = 1.04;

      function createPixelCanvas(blockDef, isTopFace) {
        const cvs = document.createElement('canvas');
        cvs.width = 16;
        cvs.height = 16;
        const ctx = cvs.getContext('2d');

        const base = isTopFace ? blockDef.topColor : blockDef.color;
        ctx.fillStyle = base;
        ctx.fillRect(0, 0, 16, 16);

        if (blockDef.style === 'grass') {
          if (isTopFace) {
            ctx.fillStyle = '#22c55e';
            ctx.fillRect(0, 0, 16, 16);
            const specks = [[2,2],[5,4],[11,3],[13,8],[4,11],[9,13],[14,14],[7,7]];
            ctx.fillStyle = '#16a34a';
            specks.forEach(([x, y]) => ctx.fillRect(x, y, 2, 2));
            ctx.fillStyle = '#4ade80';
            [[1,9],[8,2],[12,11],[6,14]].forEach(([x, y]) => ctx.fillRect(x, y, 2, 1));
          } else {
            ctx.fillStyle = '#854d0e';
            ctx.fillRect(0, 0, 16, 16);

      function initTextures() {
        BLOCK_TYPES.forEach(def => {
          const sideCanvas = createPixelCanvas(def, false);
          const topCanvas = createPixelCanvas(def, true);

          const sideTex = new THREE.CanvasTexture(sideCanvas);
          sideTex.magFilter = THREE.NearestFilter;
          sideTex.minFilter = THREE.NearestFilter;

          const topTex = new THREE.CanvasTexture(topCanvas);
          topTex.magFilter = THREE.NearestFilter;
          topTex.minFilter = THREE.NearestFilter;

          blockTextures[def.id] = { side: sideTex, top: topTex };
          blockPreviewUrls[def.id] = sideCanvas.toDataURL();
        });
      }

      // ==========================================
      // 3. THREE.JS 3D VOXEL SCENE SETUP
      // ==========================================
      const container = document.getElementById('canvas-container');
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x7dd3fc);

      const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });

      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      container.appendChild(renderer.domElement);

      const ambientLight = new THREE.AmbientLight(0xffffff, 0.80);
      scene.add(ambientLight);

      const hemiLight = new THREE.HemisphereLight(0xffffff, 0x86efac, 0.36);
      hemiLight.position.set(0, 30, 0);
      scene.add(hemiLight);

      const dirLight = new THREE.DirectionalLight(0xfffbeb, 0.85);
      dirLight.position.set(18, 30, 20);

      dirLight.shadow.mapSize.width = 1024;
      dirLight.shadow.mapSize.height = 1024;
      dirLight.shadow.camera.near = 5;
      dirLight.shadow.camera.far = 75;
      const d = 18;
      dirLight.shadow.camera.left = -d;
      dirLight.shadow.camera.right = d;
      dirLight.shadow.camera.top = d;

      const skyGroup = new THREE.Group();

      const celestialMat = new THREE.MeshBasicMaterial({ color: 0xfde047 });

      const clouds = [];
      function createVoxelClouds() {
        const cloudMat = new THREE.MeshLambertMaterial({ color: 0xffffff, transparent: true, opacity: 0.92 });
        const positions = [
          [-12, 14, -11, 4.5, 1.2, 2.6],
          [9, 15, -13, 5.2, 1.3, 3.0],
          [14, 13, 7, 3.8, 1.1, 2.5],
          [-14, 16, 9, 4.8, 1.2, 2.8]
        ];
        positions.forEach(([x, y, z, w, h, cd], idx) => {
          const g = new THREE.Group();
          const main = new THREE.Mesh(new THREE.BoxGeometry(w, h, cd), cloudMat);
          const puff = new THREE.Mesh(new THREE.BoxGeometry(w * 0.6, h * 0.9, cd * 0.7), cloudMat);
          puff.position.set(0.4, h * 0.5, 0);
          g.add(main, puff);
          g.position.set(x, y, z);
          skyGroup.add(g);
          clouds.push({ mesh: g, speed: 0.35 + idx * 0.1 });
        });
      }
      createVoxelClouds();

      // ==========================================
      // 4. VOXEL WORLD DATA, GEOMETRY CACHE & 18x18 ISLAND
      // ==========================================
      const GRID_SIZE = 18;

      let groundMesh = null;

      let raycastDirty = true;

      const unitBoxGeo = new THREE.BoxGeometry(1, 1, 1);
      const GEO_CACHE = { '1,1,1': unitBoxGeo };
      const MAT_CACHE = {};
      const BLOCK_MAT_CACHE = {};
      const HITBOX_MAT = new THREE.MeshBasicMaterial({ transparent: true, opacity: 0, depthWrite: false });
      const NOOP_RAYCAST = function () {};

      function getBoxGeo(w, h, depth) {
        const key = `${w.toFixed(3)},${h.toFixed(3)},${depth.toFixed(3)}`;
        if (!GEO_CACHE[key]) {
          GEO_CACHE[key] = new THREE.BoxGeometry(w, h, depth);
        }
        return GEO_CACHE[key];
      }

      function getColorMat(hex, opts) {
        const extra = opts ? `${opts.transparent ? 1 : 0}_${opts.opacity || 1}_${opts.emissive || 0}_${opts.basic ? 1 : 0}` : 'std';
        const key = `${hex}_${extra}`;
        if (!MAT_CACHE[key]) {
          if (opts && opts.basic) {
            MAT_CACHE[key] = new THREE.MeshBasicMaterial({
              color: hex,
              transparent: !!opts.transparent,
              opacity: opts.opacity !== undefined ? opts.opacity : 1.0
            });
          } else {
            MAT_CACHE[key] = new THREE.MeshLambertMaterial({
              color: hex,
              transparent: !!(opts && opts.transparent),
              opacity: (opts && opts.opacity !== undefined) ? opts.opacity : 1.0,
              emissive: (opts && opts.emissive) ? new THREE.Color(opts.emissive) : new THREE.Color(0x000000),
              emissiveIntensity: (opts && opts.emissiveIntensity) ? opts.emissiveIntensity : 0
            });
          }
        }
        return MAT_CACHE[key];
      }

      function finalizePropGroup(group) {
        group.traverse(child => {
          if (child.isMesh) {
            child.raycast = NOOP_RAYCAST;
          }
        });
        const hitMesh = new THREE.Mesh(unitBoxGeo, HITBOX_MAT);
        group.add(hitMesh);
        group.userData.hitMesh = hitMesh;
        return group;
      }

      function posKey(x, y, z) {
        return `${x},${y},${z}`;
      }

      function parseKey(k) {
        return k.split(',').map(Number);
      }

      function createBlockMesh(typeId, isBaseBlock) {
        const def = BLOCK_MAP[typeId] || BLOCK_MAP.wood;
        const tex = blockTextures[def.id];

        // 1. 🌿 3D Voxel Lush Grass Tuft
        if (def.style === 'grass' && !isBaseBlock) {
          const group = new THREE.Group();

          soilPatch.position.y = -0.45;

          const swayGroup = new THREE.Group();
          const bladeSpecs = [
            [-0.24, -0.18, 0.12, 0.62, 0.12, 0x16a34a],
            [ 0.22, -0.20, 0.11, 0.54, 0.11, 0x22c55e],

            [ 0.12,  0.26, 0.10, 0.50, 0.10, 0x4ade80]

          bladeSpecs.forEach(([bx, bz, bw, bh, bd, col], idx) => {
            const blade = new THREE.Mesh(getBoxGeo(bw, bh, bd), getColorMat(col));
            blade.position.set(bx, -0.42 + bh / 2, bz);
            swayGroup.add(blade);
            const tip = new THREE.Mesh(getBoxGeo(bw * 0.75, 0.14, bd * 0.75), tipMat);
            tip.position.set(bx + (idx % 2 === 0 ? 0.03 : -0.03), -0.42 + bh + 0.05, bz);
            swayGroup.add(tip);
          });
          group.add(swayGroup);
          group.userData.swayGroup = swayGroup;
          return finalizePropGroup(group);
        }

        // 2. 🌻 3D Voxel Multi-Flower Cluster
        if (def.style === 'flower') {
          const group = new THREE.Group();
          const soilBed = new THREE.Mesh(getBoxGeo(0.68, 0.06, 0.68), getColorMat(0x3f6212));
          soilBed.position.y = -0.47;
          group.add(soilBed);

          const swayGroup = new THREE.Group();
          const stemMat = getColorMat(0x16a34a);
          const leafMat = getColorMat(0x22c55e);

          const stemA = new THREE.Mesh(getBoxGeo(0.09, 0.48, 0.09), stemMat);
          stemA.position.set(-0.22, -0.22, 0.16);
          const leafA = new THREE.Mesh(getBoxGeo(0.20, 0.06, 0.10), leafMat);
          leafA.position.set(-0.12, -0.24, 0.16);
          const roseOuter = new THREE.Mesh(getBoxGeo(0.28, 0.14, 0.28), getColorMat(0xf43f5e));
          roseOuter.position.set(-0.22, 0.06, 0.16);
          const roseInner = new THREE.Mesh(getBoxGeo(0.18, 0.16, 0.18), getColorMat(0xe11d48));
          roseInner.position.set(-0.22, 0.12, 0.16);
          const roseCore = new THREE.Mesh(getBoxGeo(0.10, 0.18, 0.10), getColorMat(0xfde047));
          roseCore.position.set(-0.22, 0.14, 0.16);
          swayGroup.add(stemA, leafA, roseOuter, roseInner, roseCore);

          const stemB = new THREE.Mesh(getBoxGeo(0.11, 0.64, 0.11), stemMat);
          stemB.position.set(0.04, -0.14, -0.15);
          const leafB1 = new THREE.Mesh(getBoxGeo(0.24, 0.06, 0.12), leafMat);
          leafB1.position.set(-0.08, -0.16, -0.15);
          const leafB2 = new THREE.Mesh(getBoxGeo(0.24, 0.06, 0.12), leafMat);
          leafB2.position.set(0.16, -0.08, -0.15);

          tier2.position.set(0, 0.06, 0);
          const icing2 = new THREE.Mesh(getBoxGeo(0.54, 0.07, 0.54), getColorMat(0xffffff));
          icing2.position.set(0, 0.20, 0);
          const candle = new THREE.Mesh(getBoxGeo(0.10, 0.22, 0.10), getColorMat(0x38bdf8));
          candle.position.set(0, 0.32, 0);
          const flame = new THREE.Mesh(getBoxGeo(0.12, 0.12, 0.12), getColorMat(0xfacc15, { basic: true }));
          flame.position.set(0, 0.46, 0);
          group.add(plate, tier1, icing1, tier2, icing2, candle, flame);

          const berryMat = getColorMat(0xef4444);
          [[-0.28, -0.04, 0.28], [0.28, -0.04, 0.28], [-0.28, -0.04, -0.28], [0.28, -0.04, -0.28]].forEach(([bx, by, bz]) => {
            const berry = new THREE.Mesh(getBoxGeo(0.11, 0.11, 0.11), berryMat);
            berry.position.set(bx, by, bz);
            group.add(berry);
          });

          return finalizePropGroup(group);
        }

        // Standard Cube Blocks — 100% Cached Material Array per Block Type!
        if (!BLOCK_MAT_CACHE[def.id]) {
          const sideMat = new THREE.MeshLambertMaterial({
            map: tex.side,
            transparent: !!def.transparent,
            opacity: def.style === 'glass' ? 0.65 : (def.style === 'water' ? 0.78 : 1.0),
            emissive: def.light ? new THREE.Color(0xfbbf24) : new THREE.Color(0x000000),
            emissiveIntensity: def.light ? 0.55 : 0
          });
          const topMat = new THREE.MeshLambertMaterial({
            map: tex.top,
            transparent: !!def.transparent,
            opacity: def.style === 'glass' ? 0.65 : (def.style === 'water' ? 0.78 : 1.0),
            emissive: def.light ? new THREE.Color(0xfef08a) : new THREE.Color(0x000000),
            emissiveIntensity: def.light ? 0.65 : 0
          });
          BLOCK_MAT_CACHE[def.id] = [sideMat, sideMat, topMat, sideMat, sideMat, sideMat];
        }

        const mesh = new THREE.Mesh(unitBoxGeo, BLOCK_MAT_CACHE[def.id]);
        mesh.castShadow = !def.transparent;
        mesh.receiveShadow = true;
        return mesh;
      }

      // Single-Mesh 18x18 Island Base (1 draw call instead of 324 separate ground meshes!)
      function buildIslandBase() {
        const grassTex = blockTextures.grass;
        const topRepeat = grassTex.top.clone();
        topRepeat.wrapS = THREE.RepeatWrapping;
        topRepeat.wrapT = THREE.RepeatWrapping;
        topRepeat.repeat.set(GRID_SIZE, GRID_SIZE);
        topRepeat.needsUpdate = true;

        const sideRepeat = grassTex.side.clone();
        sideRepeat.wrapS = THREE.RepeatWrapping;
        sideRepeat.wrapT = THREE.ClampToEdgeWrapping;
        sideRepeat.repeat.set(GRID_SIZE, 1);
        sideRepeat.needsUpdate = true;

        const sideMat = new THREE.MeshLambertMaterial({ map: sideRepeat });
        const topMat = new THREE.MeshLambertMaterial({ map: topRepeat });
        const botMat = getColorMat(0x713f12);

        const groundGeo = new THREE.BoxGeometry(GRID_SIZE, 1, GRID_SIZE);
        groundMesh = new THREE.Mesh(groundGeo, [sideMat, sideMat, topMat, botMat, sideMat, sideMat]);
        // MIN_COORD = -9, MAX_COORD = 8 -> spans x: [-9, 9], z: [-9, 9], centered at (0, 0.5, 0)
        groundMesh.position.set(0, 0.5, 0);
        groundMesh.receiveShadow = true;
        groundMesh.userData = { isGround: true, isBase: true, gx: 0, gy: 0, gz: 0 };
        worldGroup.add(groundMesh);

        const dirtGeo = new THREE.BoxGeometry(GRID_SIZE - 0.3, 1.5, GRID_SIZE - 0.3);
        const dirtMesh = new THREE.Mesh(dirtGeo, botMat);
        dirtMesh.position.set(0, -0.75, 0);
        dirtMesh.raycast = NOOP_RAYCAST;
        worldGroup.add(dirtMesh);

        const rockGeo = new THREE.BoxGeometry(GRID_SIZE - 2.6, 1.3, GRID_SIZE - 2.6);
        const rockMesh = new THREE.Mesh(rockGeo, getColorMat(0x64748b));
        rockMesh.position.set(0, -2.05, 0);
        rockMesh.raycast = NOOP_RAYCAST;
        worldGroup.add(rockMesh);
        raycastDirty = true;
      }

      function updateBlockCounter() {
        const badge = document.getElementById('block-counter-badge');

      function setBlockSilent(gx, gy, gz, typeId) {
        if (gx < MIN_COORD || gx > MAX_COORD || gz < MIN_COORD || gz > MAX_COORD) return null;
        if (gy < 1 || gy > MAX_HEIGHT) return null;

        const key = posKey(gx, gy, gz);
        const existing = userBlocks.get(key);
        const prevType = existing ? existing.type : null;

        if (existing) {
          worldGroup.remove(existing.mesh);
          animatingBlocks.delete(existing);
          dynamicBlocks.delete(existing);
          userBlocks.delete(key);
          raycastDirty = true;
        }

        if (!typeId) {
          updateBlockCounter();
          return { gx, gy, gz, prevType, newType: null };
        }

        const mesh = createBlockMesh(typeId);
        mesh.position.set(gx + 0.5, gy + 0.5, gz + 0.5);
        const uData = Object.assign(mesh.userData || {}, { gx, gy, gz, isBase: false, type: typeId });
        mesh.userData = uData;
        const hitTarget = uData.hitMesh || mesh;
        hitTarget.userData = uData;

        mesh.scale.set(0.2, 0.2, 0.2);
        uData.animScale = 0.2;

        worldGroup.add(mesh);

        const entry = { type: typeId, mesh, hitTarget };
        userBlocks.set(key, entry);
        animatingBlocks.add(entry);
        if (uData.swayGroup || uData.swingPivot || typeId === 'water') {
          dynamicBlocks.add(entry);
        }
        raycastDirty = true;
        updateBlockCounter();
        return { gx, gy, gz, prevType, newType: typeId };
      }

      function applySandGravity(gx, startGy, gz) {
        let landY = startGy;
        while (landY > 1 && !userBlocks.has(posKey(gx, landY - 1, gz))) {
          landY--;
        }
        if (landY === startGy) {
          const ch = setBlockSilent(gx, startGy, gz, 'sand');
          return ch ? [ch] : [];
        }
        const ch = setBlockSilent(gx, landY, gz, 'sand');
        const entry = userBlocks.get(posKey(gx, landY, gz));
        if (entry && entry.mesh) {
          entry.mesh.position.y = startGy + 0.5;
          entry.mesh.userData.fallY = startGy + 0.5;
          entry.mesh.userData.fallVel = 0;
          const below = userBlocks.get(posKey(gx, landY - 1, gz));
          entry.mesh.userData.bounceOnLand = !!(below && below.type === 'soft_mat');
          animatingBlocks.add(entry);
        }
        return ch ? [ch] : [];
      }

      function scheduleWaterFlow(gx, gy, gz, spreadDepth) {
        const depth = spreadDepth || 0;
        setTimeout(() => {
          if (!userBlocks.has(posKey(gx, gy, gz))) return;
          // 1. Flow straight down if empty below (waterfall!)
          if (gy > 1 && !userBlocks.has(posKey(gx, gy - 1, gz))) {
            setBlockSilent(gx, gy - 1, gz, 'water');
            spawnBlockParticles(gx + 0.5, gy - 0.2, gz + 0.5, 0x38bdf8, 6);
            playSfx('splash');
            scheduleWaterFlow(gx, gy - 1, gz, depth);
            return;
          }
          // 2. Spread 1 step horizontally on supported surface
          if (depth < 1) {
            const dirs = [[1, 0], [-1, 0], [0, 1], [0, -1]];
            dirs.forEach(([dx, dz]) => {
              const nx = gx + dx;
              const nz = gz + dz;
              if (nx < MIN_COORD || nx > MAX_COORD || nz < MIN_COORD || nz > MAX_COORD) return;
              const supported = (gy === 1) || userBlocks.has(posKey(nx, gy - 1, nz));
              if (supported && !userBlocks.has(posKey(nx, gy, nz))) {
                setBlockSilent(nx, gy, nz, 'water');
                const childEntry = userBlocks.get(posKey(nx, gy, nz));
                if (childEntry && childEntry.mesh) {
                  childEntry.mesh.userData.waterScaleY = 0.72;
                }
                spawnBlockParticles(nx + 0.5, gy + 0.4, nz + 0.5, 0x7dd3fc, 4);
              }
            });
          }
        }, 180);
      }

      function recordChanges(changes) {
        const valid = changes.filter(Boolean);
        if (valid.length > 0) {
          undoStack.push(valid);
          if (undoStack.length > 40) undoStack.shift();
          autoSaveCurrentWorld();
          if (typeof checkStoryProgress === 'function') checkStoryProgress();
        }
      }

      function undoLastAction() {
        if (undoStack.length === 0) {
          speakCoach('已經回到最前面囉！');
          return;
        }
        const lastChanges = undoStack.pop();
        for (let i = lastChanges.length - 1; i >= 0; i--) {
          const ch = lastChanges[i];
          setBlockSilent(ch.gx, ch.gy, ch.gz, ch.prevType);
        }
        playSfx('erase');
        speakCoach('復原成功！回到上一步囉！');
        autoSaveCurrentWorld();
        if (typeof checkStoryProgress === 'function') checkStoryProgress();
      }

      // ==========================================
      // 7. 1-TAP MAGIC HOUSE PREFAB GENERATOR
      // ==========================================
      function getBlueprintBlocks(stampName, cx, cz) {
        const list = [];
        const add = (dx, dy, dz, type) => {
          list.push({ gx: cx + dx, gy: dy, gz: cz + dz, type });
        };

        if (stampName === 'cabin') {
          for (let dx = -2; dx <= 2; dx++) {
            for (let dz = -2; dz <= 2; dz++) {
              add(dx, 1, dz, 'stone');
              const isEdge = Math.abs(dx) === 2 || Math.abs(dz) === 2;
              if (isEdge) {
                for (let y = 2; y <= 3; y++) {
                  if (dx === 0 && dz === 2) {
                    add(dx, y, dz, 'door');
                  } else if ((dx === 0 && dz === -2 && y === 2) || (Math.abs(dx) === 2 && dz === 0 && y === 2)) {
                    add(dx, y, dz, 'glass');
                  } else {
                    add(dx, y, dz, 'wood');
                  }
                }
              }
            }
          }
          add(0, 3, 0, 'lamp');
          add(2, 2, 3, 'flower');
          add(-2, 2, 3, 'flower');
          for (let dx = -2; dx <= 2; dx++) {
            for (let dz = -2; dz <= 2; dz++) {
              add(dx, 4, dz, 'roof_red');
            }
          }
          for (let dx = -1; dx <= 1; dx++) {
            for (let dz = -1; dz <= 1; dz++) {
              add(dx, 5, dz, 'roof_red');
            }
          }
          add(0, 6, 0, 'gold');
        } else if (stampName === 'castle') {
          for (let dx = -2; dx <= 2; dx++) {
            for (let dz = -2; dz <= 2; dz++) {
              const isEdge = Math.abs(dx) === 2 || Math.abs(dz) === 2;
              const isCorner = Math.abs(dx) === 2 && Math.abs(dz) === 2;
              if (isEdge) {
                for (let y = 1; y <= 3; y++) {
                  if (dx === 0 && dz === 2 && y <= 2) {
                    add(dx, y, dz, 'door');
                  } else if (y === 2 && (dx === 0 || dz === 0)) {
                    add(dx, y, dz, 'glass');
                  } else {
                    add(dx, y, dz, 'pink');
                  }
                }
              }
              if (isCorner) {
                add(dx, 4, dz, 'pink');
                add(dx, 5, dz, 'gold');
                add(dx, 6, dz, 'roof_red');
              } else if (isEdge && ((dx + dz) % 2 === 0)) {
                add(dx, 4, dz, 'gold');
              }
            }
          }
          add(0, 1, 0, 'lamp');
        } else if (stampName === 'treehouse') {
          for (let y = 1; y <= 4; y++) {
            add(0, y, 0, 'wood');
          }
          for (let dx = -2; dx <= 2; dx++) {
            for (let dz = -2; dz <= 2; dz++) {
              add(dx, 4, dz, 'grass');
              const isEdge = Math.abs(dx) === 2 || Math.abs(dz) === 2;
              if (isEdge) {
                if (dx === 0 && dz === 2) {
                  add(dx, 5, dz, 'door');
                } else if (dx === 0 || dz === 0) {
                  add(dx, 5, dz, 'glass');
                } else {
                  add(dx, 5, dz, 'grass');
                }
              }
            }
          }
          for (let dx = -1; dx <= 1; dx++) {
            for (let dz = -1; dz <= 1; dz++) {
              add(dx, 6, dz, 'grass');
            }
          }
          add(0, 5, 0, 'lamp');
          add(1, 1, 1, 'flower');
          add(-1, 1, 1, 'flower');
        } else if (stampName === 'walls') {
          for (let dx = -2; dx <= 2; dx++) {
            for (let dz = -2; dz <= 2; dz++) {
              const isEdge = Math.abs(dx) === 2 || Math.abs(dz) === 2;
              if (isEdge) {
                for (let y = 1; y <= 2; y++) {
                  if (dx === 0 && dz === 2) {
                    add(dx, y, dz, 'door');
                  } else if (y === 2 && (dx === 0 || dz === 0)) {
                    add(dx, y, dz, 'glass');
                  } else {
                    add(dx, y, dz, 'brick');
                  }
                }
              }
            }
          }
        } else if (stampName === 'roof') {
          let baseRoofY = 3;
          for (let dx = -2; dx <= 2; dx++) {
            for (let dz = -2; dz <= 2; dz++) {
              for (let y = MAX_HEIGHT - 2; y >= 1; y--) {
                if (userBlocks.has(posKey(cx + dx, y, cz + dz))) {
                  if (y + 1 > baseRoofY) baseRoofY = y + 1;
                  break;
                }
              }
            }
          }
          baseRoofY = Math.min(baseRoofY, MAX_HEIGHT - 2);
          for (let dx = -2; dx <= 2; dx++) {
            for (let dz = -2; dz <= 2; dz++) {
              add(dx, baseRoofY, dz, 'roof_red');
            }
          }
          for (let dx = -1; dx <= 1; dx++) {
            for (let dz = -1; dz <= 1; dz++) {
              add(dx, baseRoofY + 1, dz, 'roof_red');
            }
          }
          add(0, baseRoofY + 2, 0, 'gold');
        } else if (stampName === 'pool') {
          for (let dx = -2; dx <= 2; dx++) {
            for (let dz = -2; dz <= 2; dz++) {
              const isEdge = Math.abs(dx) === 2 || Math.abs(dz) === 2;
              if (isEdge) {
                add(dx, 1, dz, 'gold');
                if (Math.abs(dx) === 2 && Math.abs(dz) === 2) {
                  add(dx, 2, dz, 'flower');
                }
              } else {
                add(dx, 1, dz, 'water');
              }
            }
          }
        } else if (stampName === 'park') {
          add(-2, 1, -1, 'slide');
          add(0, 1, -1, 'swing');
          add(2, 1, -1, 'toy_train');
          add(-2, 1, 1, 'toy_car');
          add(0, 1, 1, 'soft_mat');
          add(2, 1, 1, 'cake');
          add(-3, 1, -2, 'big_tree');
          add(3, 1, -2, 'big_tree');
          add(-3, 1, 2, 'mushroom');
          add(3, 1, 2, 'chest');
          add(-1, 1, 2, 'flower');
          add(1, 1, 2, 'flower');
        }
        return list;
      }

      function applyMagicStamp(stampName, centerX, centerZ) {
        const cx = Math.max(MIN_COORD + 3, Math.min(MAX_COORD - 3, centerX));
        const cz = Math.max(MIN_COORD + 3, Math.min(MAX_COORD - 3, centerZ));

        const items = getBlueprintBlocks(stampName, cx, cz);
        const changes = [];
        items.forEach(item => {
          const ch = setBlockSilent(item.gx, item.gy, item.gz, item.type);
          if (ch) changes.push(ch);
        });
        recordChanges(changes);
        spawnBlockParticles(cx + 0.5, 3.5, cz + 0.5, 0xfde047, 18);
        playSfx('magic');

        const stampInfo = {
          cabin: ['🏡', '魔法蓋好【🏡 溫馨小木屋】！', '哇！溫馨小木屋蓋好囉！'],
          castle: ['🏰', '魔法蓋好【🏰 粉紅小城堡】！', '太酷了！粉紅小城堡出現囉！'],
          treehouse: ['🌳', '魔法蓋好【🌳 森林大樹屋】！', '好棒的森林大樹屋！'],
          park: ['🛝', '魔法蓋好【🛝 歡樂遊樂場】！有溜滑梯、鞦韆跟小火車！', '哇！歡樂遊樂場變出來囉！有溜滑梯、鞦韆和小火車！'],
          walls: ['🧱', '魔法蓋好【🧱 四面圍牆】！', '四面圍牆和門窗蓋好囉！快來加屋頂吧！'],
          roof: ['🔺', '魔法蓋好【🔺 尖尖屋頂】！', '魔法尖屋頂戴上去囉！'],
          pool: ['🏊', '魔法蓋好【🏊 陽光泳池】！', '陽光游泳池蓋好囉！好涼快呀！']
        }[stampName] || ['🪄', '魔法蓋房成功！', '魔法蓋房成功！'];
        showKidToast(stampInfo[0], stampInfo[1], stampInfo[2], 'bg-fuchsia-300/95 text-slate-900');
      }

      // ==========================================
      // 8. STEP-BY-STEP GUIDED BLUEPRINT MODE
      // ==========================================
      let guidedActive = false;
      let guidedStep = 0;
      const guidedGhostGroup = new THREE.Group();
      scene.add(guidedGhostGroup);

      const GUIDED_STEPS = [
        {
          title: '第 1 步：點亮光方塊，圍出木頭牆壁！',
          blocks: (function () {
            const arr = [];
            for (let x = -2; x <= 1; x++) {
              for (let z = -2; z <= 1; z++) {
                if (x === -2 || x === 1 || z === -2 || z === 1) {
                  if (!(x === 0 && z === 1)) {
                    arr.push({ gx: x, gy: 1, gz: z, type: 'wood' });
                  }
                }
              }
            }
            return arr;
          })()
        },
        {
          title: '第 2 步：裝上小木門與透明玻璃窗！',
          blocks: (function () {
            const arr = [
              { gx: 0, gy: 1, gz: 1, type: 'door' },
              { gx: 0, gy: 2, gz: 1, type: 'door' }
            ];
            for (let x = -2; x <= 1; x++) {
              for (let z = -2; z <= 1; z++) {
                if (x === -2 || x === 1 || z === -2 || z === 1) {
                  if (!(x === 0 && z === 1)) {
                    const isWin = (x === -1 && z === -2) || (x === -2 && z === 0) || (x === 1 && z === 0);
                    arr.push({ gx: x, gy: 2, gz: z, type: isWin ? 'glass' : 'wood' });
                  }
                }
              }
            }
            return arr;
          })()
        },
        {
          title: '第 3 步：蓋上紅屋頂與門前小花朵！',
          blocks: (function () {
            const arr = [
              { gx: 0, gy: 2, gz: 0, type: 'lamp' },
              { gx: -2, gy: 1, gz: 2, type: 'flower' },
              { gx: 1, gy: 1, gz: 2, type: 'flower' }
            ];
            for (let x = -2; x <= 1; x++) {
              for (let z = -2; z <= 1; z++) {
                arr.push({ gx: x, gy: 3, gz: z, type: 'roof_red' });
              }
            }
            for (let x = -1; x <= 0; x++) {
              for (let z = -1; z <= 0; z++) {
                arr.push({ gx: x, gy: 4, gz: z, type: 'roof_red' });
              }
            }
            return arr;
          })()
        }
      ];

      function clearGuidedGhosts() {
        while (guidedGhostGroup.children.length > 0) {
          guidedGhostGroup.remove(guidedGhostGroup.children[0]);
        }
      }

      function renderGuidedStep() {
        clearGuidedGhosts();
        const banner = document.getElementById('guided-banner');
        if (!guidedActive) {
          if (banner) banner.classList.add('hidden');
          return;
        }
        if (banner) banner.classList.remove('hidden');

        const stepData = GUIDED_STEPS[guidedStep];
        if (!stepData) {
          guidedActive = false;
          if (banner) banner.classList.add('hidden');
          launchFireworks();
          if (typeof awardBadge === 'function') awardBadge('builder', true);
          return;
        }

        const remaining = stepData.blocks.filter(b => {
          const cur = userBlocks.get(posKey(b.gx, b.gy, b.gz));
          return !cur || cur.type !== b.type;
        });

        if (remaining.length === 0) {
          guidedStep++;
          playSfx('magic');
          renderGuidedStep();
          return;
        }

        const titleEl = document.getElementById('guided-step-title');
        if (titleEl) titleEl.textContent = `${stepData.title}（差 ${remaining.length} 顆）`;

        const progEl = document.getElementById('guided-progress-bar');
        if (progEl) {
          const totalPct = Math.round(((guidedStep + (1 - remaining.length / stepData.blocks.length)) / GUIDED_STEPS.length) * 100);
          progEl.style.width = `${Math.max(12, totalPct)}%`;
        }

        const ghostMat = new THREE.MeshBasicMaterial({
          color: 0xfde047,
          wireframe: false,
          transparent: true,
          opacity: 0.48
        });

        remaining.forEach(b => {
          const gMesh = new THREE.Mesh(new THREE.BoxGeometry(0.92, 0.92, 0.92), ghostMat);
          gMesh.position.set(b.gx + 0.5, b.gy + 0.5, b.gz + 0.5);
          gMesh.userData = { isGuidedGhost: true, gx: b.gx, gy: b.gy, gz: b.gz, targetType: b.type };
          guidedGhostGroup.add(gMesh);
        });
      }

      function completeCurrentGuidedStep() {
        if (!guidedActive) return;
        const stepData = GUIDED_STEPS[guidedStep];
        if (!stepData) return;

        const changes = [];
        stepData.blocks.forEach(b => {
          const ch = setBlockSilent(b.gx, b.gy, b.gz, b.type);
          if (ch) changes.push(ch);
        });
        recordChanges(changes);
        spawnBlockParticles(0, 2.5, 0, 0xfde047, 16);
        guidedStep++;
        playSfx('magic');
        renderGuidedStep();
      }

      // ==========================================
      // 9. CAMERA ORBIT & HOVER GHOST PREVIEW
      // ==========================================
      let camTheta = Math.PI * 0.22;
      let camPhi = Math.PI * 0.30;
      let camRadius = 21.0;
      const camTarget = new THREE.Vector3(0, 1.3, 0);

      function updateCameraPosition() {
        camPhi = Math.max(0.32, Math.min(1.28, camPhi));
        camRadius = Math.max(8.5, Math.min(34, camRadius));
        const sinPhi = Math.sin(camPhi);
        camera.position.x = camTarget.x + camRadius * sinPhi * Math.sin(camTheta);
        camera.position.y = camTarget.y + camRadius * Math.cos(camPhi);
        camera.position.z = camTarget.z + camRadius * sinPhi * Math.cos(camTheta);
        camera.lookAt(camTarget);
      }
      updateCameraPosition();

      const previewMat = new THREE.MeshBasicMaterial({
        color: 0xffffff,
        wireframe: true,
        transparent: true,
        opacity: 0.75
      });
      const previewMesh = new THREE.Mesh(new THREE.BoxGeometry(1.04, 1.04, 1.04), previewMat);
      previewMesh.visible = false;
      scene.add(previewMesh);

      // ==========================================
      // 10. UI STATE, PALETTE & TOUCH INTERACTION
      // ==========================================
      let currentMode = 'build';
      let selectedBlockId = 'wood';
      let selectedStampId = 'cabin';
      let selectedMobId = 'pig';
      let brushSize = 1;
      let skyState = 0;
      let dockCollapsed = false;

      function renderBlockPalette() {
        const panel = document.getElementById('panel-build');
        if (!panel) return;
        panel.innerHTML = '';

        BLOCK_TYPES.forEach(def => {
          const btn = document.createElement('button');
          btn.type = 'button';
          const isSel = def.id === selectedBlockId;
          btn.className = `block-item-btn kid-btn flex-shrink-0 flex flex-col items-center justify-center w-12 h-12 sm:w-14 sm:h-14 rounded-xl border-b-2 transition-all ${
            isSel
              ? 'bg-amber-300 border-amber-600 kid-btn-selected text-slate-900'
              : 'bg-slate-800/90 hover:bg-slate-700 border-slate-950 text-white'
          }`;

          const img = document.createElement('img');
          img.src = blockPreviewUrls[def.id];
          img.alt = def.name;
          img.className = 'w-6 h-6 sm:w-7 sm:h-7 rounded border border-black/25 shadow-sm';

          const lbl = document.createElement('span');
          lbl.className = 'block-item-label text-[10px] font-black mt-0.5 leading-none';

              def.emoji,
              `已選取：【${def.emoji} ${def.name}】！點場上放上去吧！`,
              def.voice,
              'bg-amber-300/95 text-slate-900'
            );
          });

          panel.appendChild(btn);

      }


      // ==========================================
      // KINDERGARTEN BADGES + STORY SITUATIONS
      // ==========================================
      const BADGE_DEFS = [
        { id: 'helper', name: '開心小幫手', emoji: '🤝', hint: '完成開心上學日' },
        { id: 'share', name: '分享小天使', emoji: '😇', hint: '完成分享小花園' },
        { id: 'brave', name: '勇氣小星星', emoji: '🌟', hint: '完成彩虹勇氣橋' },
        { id: 'artist', name: '畫畫小畫家', emoji: '🎨', hint: '完成星星地板派對或放蠟筆磚' },
        { id: 'builder', name: '蓋屋小建築師', emoji: '🏗️', hint: '跟著亮光蓋完房子' },
        { id: 'polite', name: '禮貌小寶貝', emoji: '🎀', hint: '跟阿奇老師打招呼' }
      ];
      const BADGE_STORAGE_KEY = 'minicraft_kids_badges';
      let earnedBadges = {};

      function loadEarnedBadges() {
        try {
          const raw = localStorage.getItem(BADGE_STORAGE_KEY);
          earnedBadges = raw ? JSON.parse(raw) : {};
          if (!earnedBadges || typeof earnedBadges !== 'object') earnedBadges = {};
        } catch (e) {
          earnedBadges = {};
        }
      }

      function saveEarnedBadges() {
        try {
          localStorage.setItem(BADGE_STORAGE_KEY, JSON.stringify(earnedBadges));
        } catch (e) {}
      }

      function renderBadgeGrid() {
        const grid = document.getElementById('badge-grid');
        if (!grid) return;
        grid.innerHTML = '';
        BADGE_DEFS.forEach(def => {
          const got = !!earnedBadges[def.id];
          const card = document.createElement('div');
          card.className = got
            ? 'bg-violet-50 border-2 border-violet-400 rounded-2xl p-2 flex flex-col items-center gap-1'
            : 'bg-slate-50 border-2 border-slate-200 rounded-2xl p-2 flex flex-col items-center gap-1 opacity-70';
          card.innerHTML =
            '<span class="text-2xl">' + (got ? def.emoji : '🔒') + '</span>' +
            '<span class="text-xs font-black text-slate-800 text-center">' + def.name + '</span>' +
            '<span class="text-[10px] font-bold text-slate-500 text-center">' + (got ? '已拿到！' : def.hint) + '</span>';
          grid.appendChild(card);
        });
      }

      function openBadgeModal() {
        loadEarnedBadges();
        renderBadgeGrid();
        const modal = document.getElementById('badge-modal');
        if (modal) modal.classList.remove('hidden');
        playSfx('place');
        speakCoach('打開我的徽章冊！看看你拿到哪些星星徽章！');
      }

      function awardBadge(badgeId, celebrate) {
        loadEarnedBadges();
        if (earnedBadges[badgeId]) return false;
        const def = BADGE_DEFS.find(b => b.id === badgeId);
        if (!def) return false;
        earnedBadges[badgeId] = Date.now();
        saveEarnedBadges();
        if (celebrate !== false) {
          launchFireworks();
          speakCoach('恭喜拿到徽章：' + def.name + '！阿奇老師好為你驕傲喔！');
        }
        renderBadgeGrid();
        return true;
      }

      const STORY_DEFS = {
        school_day: {
          id: 'school_day',
          title: '開心上學日',
          goal: '蓋小教室：黑板＋小課桌＋小木門',
          badge: 'helper',
          voice: '開心上學日！跟阿奇老師蓋一間有黑板、課桌和門的小教室吧！',
          eval() {
            const board = countBlocksOfType('chalk_board');
            const desk = countBlocksOfType('desk');
            const door = countBlocksOfType('door');
            const parts = [
              { ok: board >= 1, label: '黑板 ' + Math.min(board, 1) + '/1' },
              { ok: desk >= 1, label: '課桌 ' + Math.min(desk, 1) + '/1' },
              { ok: door >= 1, label: '門 ' + Math.min(door, 1) + '/1' }
            ];
            const done = parts.filter(p => p.ok).length;
            return { done, total: 3, hint: parts.map(p => p.label).join(' · '), complete: done >= 3 };
          }
        },
        share_garden: {
          id: 'share_garden',
          title: '分享小花園',
          goal: '在草地上種至少 5 朵小花',
          badge: 'share',
          voice: '分享小花園！多種幾朵花，跟阿奇老師一起欣賞喔！',
          eval() {
            const n = countBlocksOfType('flower');
            return { done: Math.min(n, 5), total: 5, hint: '小花 ' + n + '/5', complete: n >= 5 };
          }
        },
        rainbow_bridge: {
          id: 'rainbow_bridge',
          title: '彩虹勇氣橋',
          goal: '用彩虹磚鋪至少 6 格長的路',
          badge: 'brave',
          voice: '彩虹勇氣橋！用彩虹磚鋪一條至少六格的小路吧！',
          eval() {
            const n = countBlocksOfType('rainbow');
            return { done: Math.min(n, 6), total: 6, hint: '彩虹磚 ' + n + '/6', complete: n >= 6 };
          }
        },
        star_party: {
          id: 'star_party',
          title: '星星地板派對',
          goal: '鋪 8 塊星星地板，再放一盞發光燈',
          badge: 'artist',
          voice: '星星地板派對！鋪滿星星地板，再點一盞溫暖小燈！',
          eval() {
            const stars = countBlocksOfType('star_tile');
            const lamps = countBlocksOfType('lamp');
            const starDone = Math.min(stars, 8);
            const lampDone = lamps >= 1 ? 1 : 0;
            const done = starDone + lampDone;
            return {
              done,
              total: 9,
              hint: '星星 ' + stars + '/8 · 燈 ' + lampDone + '/1',
              complete: stars >= 8 && lamps >= 1
            };
          }
        }
      };

      let storyActive = false;
      let activeStoryId = null;

      function countBlocksOfType(typeId) {
        let n = 0;
        userBlocks.forEach(val => {
          if (val && val.type === typeId) n++;
        });
        return n;
      }

      function ensureArchieTeacherNearby() {
        const has = mobs.some(m => m.type === 'archie_teacher');
        if (!has) {
          spawnMobAt('archie_teacher', -1, 1, true);
          if (typeof awardBadge === 'function') awardBadge('polite', false);
        }
      }

      function updateStoryBanner() {
        const banner = document.getElementById('story-banner');
        if (!banner) return;
        if (!storyActive || !activeStoryId || !STORY_DEFS[activeStoryId]) {
          banner.classList.add('hidden');
          return;
        }
        banner.classList.remove('hidden');
        const def = STORY_DEFS[activeStoryId];
        const progress = def.eval();
        const titleEl = document.getElementById('story-step-title');
        const barEl = document.getElementById('story-progress-bar');
        const hintEl = document.getElementById('story-step-hint');
        if (titleEl) titleEl.textContent = '情節：' + def.title + ' — ' + def.goal;
        if (hintEl) hintEl.textContent = progress.hint;
        if (barEl) {
          const pct = Math.round((progress.done / progress.total) * 100);
          barEl.style.width = pct + '%';
        }
      }

      function startStory(storyId) {
        const def = STORY_DEFS[storyId];
        if (!def) return;
        if (guidedActive) {
          guidedActive = false;
          renderGuidedStep();
        }
        storyActive = true;
        activeStoryId = storyId;
        ensureArchieTeacherNearby();
        const pick = {
          school_day: 'chalk_board',
          share_garden: 'flower',
          rainbow_bridge: 'rainbow',
          star_party: 'star_tile'
        }[storyId];
        if (pick && BLOCK_MAP[pick]) {
          selectedBlockId = pick;
        }
        setMode('build', false);
        renderBlockPalette();
        updateStoryBanner();
        playSfx('magic');
        speakCoach(def.voice);
        checkStoryProgress();
      }

      function stopStory() {
        storyActive = false;
        activeStoryId = null;
        updateStoryBanner();
        speakCoach('情節先休息一下，自由蓋房子也可以喔！');
      }

      function checkStoryProgress() {
        if (!storyActive || !activeStoryId) {
          updateStoryBanner();
          return;
        }
        const def = STORY_DEFS[activeStoryId];
        if (!def) return;
        const progress = def.eval();
        updateStoryBanner();
        if (progress.complete) {
          const badgeId = def.badge;
          const newly = awardBadge(badgeId, true);
          storyActive = false;
          activeStoryId = null;
          updateStoryBanner();
          if (!newly) {
            speakCoach(def.title + '又完成一次囉！你超棒的！');
            launchFireworks();
          }
        }
      }

        currentMode = mode;

        if (dockBody) {
          dockBody.classList.remove('hidden');
          dockBody.style.display = 'flex';
        }
        const tabsRow = document.getElementById('mode-tabs-row');
        if (tabsRow) {
          tabsRow.classList.remove('hidden');
          tabsRow.style.display = 'flex';
        }
        const iconEl = document.getElementById('dock-toggle-icon');
        const textEl = document.getElementById('dock-toggle-text');
        if (iconEl) iconEl.textContent = '🔽';
        if (textEl) textEl.textContent = '收起清單';

        const tabs = {
          build: document.getElementById('tab-build'),
          magic: document.getElementById('tab-magic'),
